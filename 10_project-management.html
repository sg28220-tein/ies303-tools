    STATE.tab = this.dataset.tab; renderTabBar(); renderTabBody();
  });
}

function renderTabBody(){
  if(STATE.tab === 'cp') return renderCP();
  return renderNet();
}

/* =====================================================================
   TAB 1 — NETWORK DIAGRAM  (deck slides 4-16)
   AON: events are auto-placed, the student draws only the arrows.
   AOA: the student builds everything — events, arrows and dummies.
   ===================================================================== */

function ensureNetState(){
  var sig = actsSignature();
  if(!STATE.net || STATE.net.sig !== sig){
    STATE.net = { sig:sig, armed:null, sel:null, result:null, banner:null, neutral:false,
                  gstep:-1, drag:null, selNode:null };
  }
}

/* ---- AON: automatic layered placement, S at layer -1 ---- */
function aonLayout(){
  var acts = STATE.acts, L = layersOf(acts), cols = {}, maxL = 0, i;
  for(i = 0; i < acts.length; i++){
    var l = L[acts[i].id];
    if(!cols[l]) cols[l] = [];
    cols[l].push(acts[i].id);
    if(l > maxL) maxL = l;
  }
  var NW = 96, NH = 46, GX = 74, GY = 26, M = 18;
  var tallest = 1;
  for(i = 0; i <= maxL; i++) if(cols[i] && cols[i].length > tallest) tallest = cols[i].length;
  var H = M * 2 + tallest * NH + (tallest - 1) * GY;
  var pos = { S:{ x:M, y:M + (H - M * 2 - NH) / 2 } };
  for(i = 0; i <= maxL; i++){
    var list = cols[i] || [], colH = list.length * NH + (list.length - 1) * GY;
    var y0 = M + (H - M * 2 - colH) / 2;
    for(var j = 0; j < list.length; j++)
      pos[list[j]] = { x: M + (i + 1) * (NW + GX), y: y0 + j * (NH + GY) };
  }
  return { pos:pos, W: M * 2 + (maxL + 2) * NW + (maxL + 1) * GX, H:H, NW:NW, NH:NH };
}

/* Current AON positions: the automatic layout, with any boxes the student has
   dragged taking precedence. */
function aonPositions(){
  var lay = aonLayout(), id;
  for(id in STATE.aon.pos)
    if(STATE.aon.pos.hasOwnProperty(id) && lay.pos[id])
      lay.pos[id] = { x:STATE.aon.pos[id].x, y:STATE.aon.pos[id].y };
  var maxX = 0, maxY = 0;
  for(id in lay.pos) if(lay.pos.hasOwnProperty(id)){
    if(lay.pos[id].x + lay.NW > maxX) maxX = lay.pos[id].x + lay.NW;
    if(lay.pos[id].y + lay.NH > maxY) maxY = lay.pos[id].y + lay.NH;
  }
  lay.W = Math.max(lay.W, maxX + 20);
  lay.H = Math.max(lay.H, maxY + 20);
  return lay;
}

/* An arrow that would pass straight through a box in between is routed around
   it. Without this, D->G reads as D->F on the lecture example, because F sits
   exactly on the straight line between them — and if D->G is drawn as critical,
   the wrong arrow looks critical too.

   Shared by the tab-1 AON canvas and the tab-2 critical-path diagram, which
   use different box sizes, so NW and NH are parameters.
   pos: { id: {x, y} } of every box on the canvas, top-left corners. */
function routedArcPath(a, b, NW, NH, pos, fromId, toId){
  var x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
  var loY = Math.min(y1, y2) - 8, hiY = Math.max(y1, y2) + 8;
  var top = Infinity, bot = -Infinity, blocked = false, id;
  for(id in pos) if(pos.hasOwnProperty(id) && id !== fromId && id !== toId){
    var p = pos[id];
    var between = p.x + NW > x1 + 4 && p.x < x2 - 4;
    if(between){
      if(p.y + NH > loY && p.y < hiY) blocked = true;
      if(p.y < top) top = p.y;
      if(p.y + NH > bot) bot = p.y + NH;
    }
  }
  if(!blocked || top === Infinity){
    var mx = (x1 + x2) / 2;
    return 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + (x2 - 3) + ' ' + y2;
  }
  var midY = (y1 + y2) / 2, above = top - 24, below = bot + 24;
  var ry = Math.abs(above - midY) <= Math.abs(below - midY) ? above : below;
  var q1 = x1 + 46, q2 = x2 - 46, cx = (x1 + x2) / 2;
  return 'M' + x1 + ' ' + y1 + ' C' + q1 + ' ' + y1 + ', ' + q1 + ' ' + ry + ', ' + cx + ' ' + ry +
         ' C' + q2 + ' ' + ry + ', ' + q2 + ' ' + y2 + ', ' + (x2 - 3) + ' ' + y2;
}
function aonArcPath(a, b, lay, pos, fromId, toId){
  return routedArcPath(a, b, lay.NW, lay.NH, pos, fromId, toId);
}

function aonSVG(arcs, opts){
  opts = opts || {};
  var lay = aonPositions(), pos = lay.pos, i;
  var g = '<defs><marker id="an1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>';
  for(i = 0; i < arcs.length; i++){
    var a = pos[arcs[i].from], b = pos[arcs[i].to];
    if(!a || !b) continue;
    var d = aonArcPath(a, b, lay, pos, arcs[i].from, arcs[i].to);
    g += '<path d="' + d + '" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#an1)"/>';
    if(opts.clickArcs) g += '<path class="arcHit" d="' + d + '" data-arc="' + i + '"></path>';
  }
  var ids = ['S'];
  for(i = 0; i < STATE.acts.length; i++) ids.push(STATE.acts[i].id);
  for(i = 0; i < ids.length; i++){
    var id = ids[i], p = pos[id];
    if(!p) continue;
    var isS = id === 'S', seld = opts.sel === id;
    g += '<rect class="nodeHit' + (opts.draggable ? ' drag' : '') + '" data-node="' + esc(id) + '" x="' + p.x +
         '" y="' + p.y + '" width="' + lay.NW + '" height="' + lay.NH + '" rx="' + (isS ? 22 : 9) +
         '" fill="' + (seld ? '#eff6ff' : (isS ? '#f8fafc' : '#fff')) +
         '" stroke="' + (seld ? '#2563eb' : '#cbd5e1') + '" stroke-width="' + (seld ? 3 : 1.6) + '"/>';
    g += '<text x="' + (p.x + lay.NW / 2) + '" y="' + (p.y + lay.NH / 2 + 6) + '" text-anchor="middle" font-size="16" ' +
         'font-weight="700" fill="' + (isS ? '#6b7280' : '#1f2937') + '" pointer-events="none">' + esc(isS ? 'Start' : id) + '</text>';
  }
  return '<div class="canvasWrap' + (opts.draggable ? ' build' : '') + '"><svg viewBox="0 0 ' + lay.W + ' ' + lay.H +
         '" width="' + lay.W + '" height="' + lay.H + '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg></div>';
}

/* ---- AOA: student-built, draggable events ---- */
function aoaAutoLayout(nodes, arcs){
  var idx = {}, i, l;
  for(i = 0; i < nodes.length; i++) idx[nodes[i].id] = nodes[i];
  var nsucc = {}, deg = {}, layer = {}, queue = [];
  for(i = 0; i < nodes.length; i++){ nsucc[nodes[i].id] = []; deg[nodes[i].id] = 0; layer[nodes[i].id] = 0; }
  for(i = 0; i < arcs.length; i++){ nsucc[arcs[i].from].push(arcs[i].to); deg[arcs[i].to]++; }
  for(i = 0; i < nodes.length; i++) if(deg[nodes[i].id] === 0) queue.push(nodes[i].id);
  while(queue.length){
    var x = queue.shift();
    for(i = 0; i < nsucc[x].length; i++){
      var s = nsucc[x][i];
      if(layer[s] < layer[x] + 1) layer[s] = layer[x] + 1;
      if(--deg[s] === 0) queue.push(s);
    }
  }
  var cols = {}, maxL = 0;
  for(i = 0; i < nodes.length; i++){
    l = layer[nodes[i].id];
    if(!cols[l]) cols[l] = [];
    cols[l].push(nodes[i].id);
    if(l > maxL) maxL = l;
  }
  var tallest = 1;
  for(l = 0; l <= maxL; l++) if(cols[l] && cols[l].length > tallest) tallest = cols[l].length;
  var GX = 150, GY = 96, M = 48;
  for(l = 0; l <= maxL; l++){
    var list = cols[l] || [], off = (tallest - list.length) * GY / 2;
    for(i = 0; i < list.length; i++){ idx[list[i]].x = M + l * GX; idx[list[i]].y = M + off + i * GY; }
  }
}

function aoaSVG(nodes, arcs, opts){
  opts = opts || {};
  var byId = {}, i, R = 21;
  for(i = 0; i < STATE.acts.length; i++) byId[STATE.acts[i].id] = STATE.acts[i];
  var idx = {}, W = 620, H = 380;
  for(i = 0; i < nodes.length; i++){
    idx[nodes[i].id] = nodes[i];
    if(nodes[i].x + 90 > W) W = nodes[i].x + 90;
    if(nodes[i].y + 90 > H) H = nodes[i].y + 90;
  }
  var g = '<defs><marker id="aa1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker>' +
          '<marker id="aa2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 z" fill="#ea580c"/></marker></defs>';

  for(i = 0; i < arcs.length; i++){
    var A = idx[arcs[i].from], B = idx[arcs[i].to];
    if(!A || !B) continue;
    var dx = B.x - A.x, dy = B.y - A.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var x1 = A.x + ux * R, y1 = A.y + uy * R, x2 = B.x - ux * (R + 5), y2 = B.y - uy * (R + 5);
    var dummy = arcs[i].act == null;
    g += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' +
         (dummy ? '#ea580c' : '#6b7280') + '" stroke-width="2.2"' + (dummy ? ' stroke-dasharray="7 5"' : '') +
         ' marker-end="url(#' + (dummy ? 'aa2' : 'aa1') + ')"/>';
    if(opts.clickArcs)
      g += '<line class="arcHit" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" data-arc="' + i + '"></line>';
    var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    var label = dummy ? 'dummy' : (arcs[i].act + (byId[arcs[i].act] ? ' (' + numFmt(byId[arcs[i].act].dur) + ')' : ''));
    g += '<rect x="' + (mx - label.length * 4.1 - 5) + '" y="' + (my - 11) + '" width="' + (label.length * 8.2 + 10) +
         '" height="20" rx="5" fill="#fff" opacity="0.92" pointer-events="none"/>';
    g += '<text x="' + mx + '" y="' + (my + 4) + '" text-anchor="middle" font-size="13.5" font-weight="700" fill="' +
         (dummy ? '#ea580c' : '#1f2937') + '" pointer-events="none">' + esc(label) + '</text>';
  }
  for(i = 0; i < nodes.length; i++){
    var n = nodes[i], seld = opts.sel === n.id;
    g += '<circle class="nodeHit drag" data-node="' + n.id + '" cx="' + n.x + '" cy="' + n.y + '" r="' + R +
         '" fill="' + (seld ? '#eff6ff' : '#fff') + '" stroke="' + (seld ? '#2563eb' : '#475569') +
         '" stroke-width="' + (seld ? 3.4 : 2) + '"/>';
    g += '<text x="' + n.x + '" y="' + (n.y + 6) + '" text-anchor="middle" font-size="16" font-weight="800" ' +
         'fill="#1f2937" pointer-events="none">' + n.id + '</text>';
  }
  return '<div class="canvasWrap build"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
         '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg></div>';
}

/* ---- guided narration ---- */
function dummyReasonText(acts){
  var groups = identificationGroups(acts);
  var h = '<div class="explain"><b>Why a dummy is needed here</b><br>';
  if(groups.length){
    h += 'This table contains an <b>identification dummy</b> case: ';
    for(var i = 0; i < groups.length; i++)
      h += (i ? '; also ' : '') + '<b>' + groups[i].join(' and ') + '</b> have the same predecessors <i>and</i> the same successors';
    h += '. The logic is already correct — activity-on-arrow simply cannot draw two arrows between the same pair of events, ' +
         'so a dummy separates them. Removing it would not change the project, only the drawing. (Deck slides 15–16.)';
  } else {
    h += 'Any dummy here is a <b>logic dummy</b>: one activity needs a predecessor that a second activity must not inherit. ' +
         'If the two shared an event, the second would pick up a predecessor the table never asked for. ' +
         'Removing this kind of dummy <i>would</i> change the project. (Deck slides 12–13.)';
  }
  return h + '</div>';
}

function netGuidedSteps(){
  if(STATE.notation === 'AON'){
    var t = aonTargetEdges(STATE.acts), out = [], k;
    for(k in t) if(t.hasOwnProperty(k)){
      var p = k.split('>');
      out.push({ from:p[0], to:p[1] });
    }
    out.sort(function(a, b){ return a.to === b.to ? (a.from < b.from ? -1 : 1) : 0; });
    return out;
  }
  var d = buildAOA(STATE.acts);
  return d ? d.arcs : [];
}

/* ---- the module ---- */
function renderNet(){
  ensureNetState();
  if(validateActs(STATE.acts).length){
    $('tabBody').innerHTML = '<h2>Network diagram</h2><p class="hint">Fix the activity table above first.</p>';
    return;
  }
  var isAON = STATE.notation === 'AON', guided = STATE.mode === 'guided', i;
  var h = '<h2>Network diagram</h2>';
  h += '<div class="row noprint"><span class="seg" id="segNot">' +
       '<button data-v="AOA"' + (isAON ? '' : ' class="on"') + '>AOA — activity on arrow</button>' +
       '<button data-v="AON"' + (isAON ? ' class="on"' : '') + '>AON — activity on node</button></span></div>';

  if(STATE.net.banner) h += '<div class="okNote' + (STATE.net.neutral ? ' neutral' : '') + '">' + STATE.net.banner + '</div>';

  var steps = guided ? netGuidedSteps() : null;

  if(guided){
    var gs = STATE.net.gstep;
    h += '<div class="row noprint">' +
         '<button id="netBack"' + (gs < 0 ? ' disabled' : '') + '>◀ Back</button>' +
         '<button class="primary" id="netStep"' + (gs >= steps.length - 1 ? ' disabled' : '') + '>' +
             (gs < 0 ? 'Start drawing ▶' : 'Next arrow ▶') + '</button>' +
         '<button id="netAll">Draw the whole diagram</button>' +
         '<button id="netReset">↺ Reset</button>' +
         '<span class="hint">' + (gs < 0 ? 'Not started' : 'Arrow ' + (gs + 1) + ' of ' + steps.length) + '</span></div>';
    if(gs < 0){
      h += '<div class="explain">' + (isAON
        ? 'In <b>AON</b> every activity is a box and the arrows only show precedence. ' +
          'Because an arrow carries no work, <b>no dummy is ever needed</b> — the deck notes this on slides 13 and 16.'
        : 'In <b>AOA</b> every activity is an <i>arrow</i> between two numbered events. ' +
          'An event means "everything arriving here is finished". That is what forces dummies: sometimes the only way to ' +
          'say "c needs a and b, but d needs only b" is with an extra arrow that consumes no time.') + '</div>';
    } else {
      var st = steps[gs];
      if(isAON){
        h += '<div class="explain">Arrow <b>' + esc(st.from) + ' → ' + esc(st.to) + '</b>: ' +
             (st.from === 'S' ? '<b>' + esc(st.to) + '</b> has no predecessors, so it starts from the Start node.'
                              : '<b>' + esc(st.to) + '</b> cannot begin until <b>' + esc(st.from) + '</b> is finished.') + '</div>';
      } else if(st.act == null){
        h += '<div class="explain">Event <b>' + st.from + ' → ' + st.to + '</b> is a <b>dummy</b> (dashed). ' +
             'It takes no time; it only carries a completion forward so the events line up with the table.</div>';
        h += dummyReasonText(STATE.acts);
      } else {
        var pr = realPreds({ id:st.act, preds:(function(){
          for(i = 0; i < STATE.acts.length; i++) if(STATE.acts[i].id === st.act) return STATE.acts[i].preds || [];
          return [];
        })() }, knownIds(STATE.acts));
        h += '<div class="explain">Activity <b>' + esc(st.act) + '</b> runs from event <b>' + st.from +
             '</b> to event <b>' + st.to + '</b>' +
             (pr.length ? ', because event ' + st.from + ' is the point at which <b>' + pr.join(', ') + '</b> ' +
                          (pr.length > 1 ? 'are' : 'is') + ' finished.' : ' — it has no predecessors, so it leaves the start event.') +
             '</div>';
      }
      /* On the last arrow, close with the reason the dummies exist — otherwise
         "Draw the whole diagram" would skip the very point of the exercise. */
      if(gs === steps.length - 1){
        var nd = 0;
        for(i = 0; i < steps.length; i++) if(!isAON && steps[i].act == null) nd++;
        if(isAON){
          h += '<div class="explain">The diagram is complete. Notice there are <b>no dummies anywhere</b> — ' +
               'in AON an arrow carries no work, so precedence can always be drawn directly. ' +
               'This is the deck\'s note on slides 13 and 16.</div>';
        } else if(nd){
          h += '<div class="explain">The diagram is complete, using <b>' + nd + ' dumm' + (nd === 1 ? 'y' : 'ies') + '</b>.</div>';
          h += dummyReasonText(STATE.acts);
        } else {
          h += '<div class="explain">The diagram is complete, and <b>no dummy was needed</b> — ' +
               'every activity\'s predecessors happened to line up with an existing event.</div>';
        }
      }
    }
  }

  /* ---- the canvas ---- */
  if(isAON){
    var arcs = guided ? steps.slice(0, STATE.net.gstep + 1) : STATE.aon.arcs;
    if(!guided)
      h += '<p class="hint noprint">Click a box, then click the box it leads to, to draw an arrow. ' +
           'Click an arrow to delete it. Boxes cannot be added or removed in AON — they are the activities themselves — ' +
           'but you can <b>drag</b> them to untangle the drawing.</p>';
    h += '<div class="row noprint"><button id="aonTidy">Tidy layout</button>' +
         '<span class="hint">Drag any box to move it. Tidy puts them back on the automatic layout.</span></div>';
    h += '<div class="netLayout">' +
         aonSVG(arcs, { sel: guided ? null : STATE.net.selNode, clickArcs: !guided, draggable: true }) +
         netRefTableHTML() + '</div>';
  } else {
    var nodes, aarcs;
    if(guided){
      var full = buildAOA(STATE.acts);
      nodes = full.nodes.slice();
      aoaAutoLayout(nodes, full.arcs);
      aarcs = full.arcs.slice(0, STATE.net.gstep + 1);
    } else {
      nodes = STATE.aoa.nodes;
      aarcs = STATE.aoa.arcs;
      h += '<p class="hint noprint">Add event nodes, then click an activity chip to pick it up, click the event it starts from, ' +
           'and click the event it ends at. Drag nodes to tidy the drawing. Click an arrow to remove it.</p>';
      h += aoaPaletteHTML();
      h += '<div class="row noprint"><button id="aoaAdd">+ Add event node</button>' +
           '<button id="aoaDel"' + (STATE.net.selNode == null ? ' disabled' : '') + '>✕ Delete selected event</button>' +
           '<button id="aoaRenum">Renumber events</button>' +
           '<button id="aoaClear">Clear canvas</button></div>';
    }
    h += '<div class="netLayout">' +
         aoaSVG(nodes, aarcs, { sel: guided ? null : STATE.net.selNode, clickArcs: !guided }) +
         netRefTableHTML() + '</div>';
  }

  /* ---- practice controls and results ---- */
  if(!guided){
    h += '<div class="row noprint"><button class="primary" id="netCheck">Check my diagram</button>' +
         '<button id="netShow">Show me</button></div>';
    if(STATE.net.result) h += netResultHTML(STATE.net.result, isAON);
  }
  /* keep the canvas where the student had scrolled it — on a tablet the diagram is
     wider than the screen, and every click redraws it */
  var oldWrap = $('tabBody').querySelector('.canvasWrap'),
      keep = oldWrap ? [oldWrap.scrollLeft, oldWrap.scrollTop] : null;
  $('tabBody').innerHTML = h;
  var newWrap = keep ? $('tabBody').querySelector('.canvasWrap') : null;
  if(newWrap){ newWrap.scrollLeft = keep[0]; newWrap.scrollTop = keep[1]; }
  wireNet(steps);
}

/* A compact copy of the activity table, pinned beside the canvas so the
   student does not have to scroll back up while drawing. In practice mode a
   tick marks each activity whose arrows are already on the diagram. */
function netRefTableHTML(){
  var isAOA = STATE.notation === 'AOA', practice = STATE.mode !== 'guided';
  var known = knownIds(STATE.acts), done = {}, i, j;

  if(practice){
    if(isAOA){
      for(i = 0; i < STATE.aoa.arcs.length; i++)
        if(STATE.aoa.arcs[i].act != null) done[STATE.aoa.arcs[i].act] = true;
    } else {
      var drawn = {};
      for(i = 0; i < STATE.aon.arcs.length; i++) drawn[STATE.aon.arcs[i].from + '>' + STATE.aon.arcs[i].to] = true;
      for(i = 0; i < STATE.acts.length; i++){
        var ps0 = realPreds(STATE.acts[i], known), all = true;
        if(!ps0.length) all = !!drawn['S>' + STATE.acts[i].id];
        else for(j = 0; j < ps0.length; j++) if(!drawn[ps0[j] + '>' + STATE.acts[i].id]) all = false;
        done[STATE.acts[i].id] = all;
      }
    }
  }

  var h = '<div class="netRef"><p class="cap">Activity table</p><table class="dataT">' +
          '<tr><th>Act</th><th>Preceded by</th><th>t</th>' + (practice ? '<th>✓</th>' : '') + '</tr>';
  for(i = 0; i < STATE.acts.length; i++){
    var a = STATE.acts[i], ps = realPreds(a, known);
    h += '<tr><td class="jb"><span class="sw" style="background:' + colorOf(i) + '"></span>' + esc(a.id) + '</td>' +
         '<td class="jb" style="font-weight:600">' + (ps.length ? esc(ps.join(', ')) : '—') + '</td>' +
         '<td>' + numFmt(a.dur) + '</td>' +
         (practice ? '<td class="tick">' + (done[a.id] ? '✓' : '') + '</td>' : '') + '</tr>';
  }
  h += '</table>';
  if(practice)
    h += '<p class="cap" style="margin-top:5px">' +
         (isAOA ? 'A tick means the activity is on the diagram.' : 'A tick means all its arrows are drawn.') + '</p>';
  return h + '</div>';
}

function aoaPaletteHTML(){
  var placed = {}, i;
  for(i = 0; i < STATE.aoa.arcs.length; i++) if(STATE.aoa.arcs[i].act != null) placed[STATE.aoa.arcs[i].act] = true;
  var h = '<div class="palette">';
  for(i = 0; i < STATE.acts.length; i++){
    var id = STATE.acts[i].id, on = STATE.net.armed === id, isP = placed[id];
    h += '<span class="chip' + (on ? ' armed' : '') + (isP ? ' placed' : '') + '" data-chip="' + esc(id) + '">' +
         '<span class="sw" style="background:' + colorOf(i) + '"></span>' + esc(id) + '</span>';
  }
  h += '<span class="chip dummy' + (STATE.net.armed === '__dummy' ? ' armed' : '') + '" data-chip="__dummy">dummy</span>';
  h += '<span class="hint">' + (STATE.net.armed
        ? 'Now click the event it starts from, then the event it ends at.'
        : 'Click a chip to pick up an activity.') + '</span></div>';
  return h;
}

function netResultHTML(res, isAON){
  var h = '<ul class="errList">', i;
  if(isAON){
    if(res.ok) h += '<li class="ok">Every precedence arrow is correct, and there are no extra ones.</li>';
    for(i = 0; i < res.missing.length; i++){
      var m = res.missing[i].split('>');
      h += '<li class="err">Missing arrow <b>' + esc(m[0]) + ' → ' + esc(m[1]) + '</b>' +
           (m[0] === 'S' ? ' — ' + esc(m[1]) + ' has no predecessors, so it must start from Start.'
                         : ' — ' + esc(m[1]) + ' cannot begin until ' + esc(m[0]) + ' is done.') + '</li>';
    }
    for(i = 0; i < res.redundant.length; i++){
      var r = res.redundant[i].split('>');
      h += '<li class="warn">Arrow <b>' + esc(r[0]) + ' → ' + esc(r[1]) + '</b> is redundant — ' + esc(r[0]) +
           ' already reaches ' + esc(r[1]) + ' through another activity. Draw immediate predecessors only.</li>';
    }
    for(i = 0; i < res.extra.length; i++){
      var e = res.extra[i].split('>');
      h += '<li class="err">Arrow <b>' + esc(e[0]) + ' → ' + esc(e[1]) + '</b> is not in the table.</li>';
    }
  } else {
    for(i = 0; i < res.fatal.length; i++) h += '<li class="err">' + esc(res.fatal[i]) + '</li>';
    for(i = 0; i < res.rows.length; i++)
      h += '<li class="' + (res.rows[i].ok ? 'ok' : 'err') + '"><b>' + esc(res.rows[i].id) + '</b> — ' + res.rows[i].msg + '</li>';
    for(i = 0; i < res.warnings.length; i++) h += '<li class="warn">' + esc(res.warnings[i]) + '</li>';
  }
  return h + '</ul>';
}

/* ---- interaction ---- */
function wireNet(steps){
  var body = $('tabBody');
  function on(id, fn){ var e = $(id); if(e) e.addEventListener('click', fn); }

  segWire('segNot', function(v){ STATE.notation = v; STATE.net.gstep = -1; STATE.net.result = null;
                                 STATE.net.banner = null; STATE.net.selNode = null; STATE.net.armed = null; renderNet(); });
  on('netStep',  function(){ STATE.net.gstep = Math.min(steps.length - 1, STATE.net.gstep + 1); renderNet(); });
  on('netBack',  function(){ STATE.net.gstep = Math.max(-1, STATE.net.gstep - 1); renderNet(); });
  on('netAll',   function(){ STATE.net.gstep = steps.length - 1; renderNet(); });
  on('netReset', function(){ STATE.net.gstep = -1; renderNet(); });

  on('aoaAdd', function(){
    var n = STATE.aoa.nextNodeId++;
    var k = STATE.aoa.nodes.length;
    STATE.aoa.nodes.push({ id:n, x: 70 + (k % 5) * 130, y: 60 + Math.floor(k / 5) * 100 });
    renderNet();
  });
  on('aoaDel', function(){
    var id = STATE.net.selNode;
    if(id == null) return;
    STATE.aoa.nodes = STATE.aoa.nodes.filter(function(n){ return n.id !== id; });
    STATE.aoa.arcs  = STATE.aoa.arcs.filter(function(a){ return a.from !== id && a.to !== id; });
    STATE.net.selNode = null; STATE.net.result = null;
    renderNet();
  });
  on('aoaRenum', function(){
    var nodes = STATE.aoa.nodes, arcs = STATE.aoa.arcs, i;
    var nsucc = {}, deg = {}, queue = [], seq = [];
    for(i = 0; i < nodes.length; i++){ nsucc[nodes[i].id] = []; deg[nodes[i].id] = 0; }
    for(i = 0; i < arcs.length; i++){ nsucc[arcs[i].from].push(arcs[i].to); deg[arcs[i].to]++; }
    for(i = 0; i < nodes.length; i++) if(deg[nodes[i].id] === 0) queue.push(nodes[i].id);
    while(queue.length){
      var x = queue.shift(); seq.push(x);
      for(i = 0; i < nsucc[x].length; i++) if(--deg[nsucc[x][i]] === 0) queue.push(nsucc[x][i]);
    }
    if(seq.length !== nodes.length){ STATE.net.banner = 'The diagram contains a loop, so the events cannot be renumbered.';
                                     STATE.net.neutral = true; renderNet(); return; }
    var remap = {};
    for(i = 0; i < seq.length; i++) remap[seq[i]] = i + 1;
    for(i = 0; i < nodes.length; i++) nodes[i].id = remap[nodes[i].id];
    for(i = 0; i < arcs.length; i++){ arcs[i].from = remap[arcs[i].from]; arcs[i].to = remap[arcs[i].to]; }
    STATE.aoa.nextNodeId = seq.length + 1;
    STATE.net.selNode = null;
    renderNet();
  });
  on('aoaClear', function(){
    STATE.aoa = { nodes:[], arcs:[], nextNodeId:1 };
    STATE.net.result = null; STATE.net.selNode = null; STATE.net.armed = null;
    renderNet();
  });

  on('netCheck', function(){
    if(STATE.notation === 'AON'){
      STATE.net.result = aonValidate(STATE.aon.arcs, STATE.acts);
      STATE.net.banner = STATE.net.result.ok
        ? '✓ Correct — every precedence relation in the table is drawn, and nothing extra.' : null;
    } else {
      STATE.net.result = aoaValidate(STATE.aoa.nodes, STATE.aoa.arcs, STATE.acts);
      STATE.net.banner = STATE.net.result.ok
        ? '✓ Correct — your diagram gives exactly the precedence the table asks for.' : null;
    }
    STATE.net.neutral = false;
    renderNet();
  });
  on('netShow', function(){
    if(STATE.notation === 'AON'){
      var t = aonTargetEdges(STATE.acts), arcs = [], k;
      for(k in t) if(t.hasOwnProperty(k)){ var p = k.split('>'); arcs.push({ from:p[0], to:p[1] }); }
      STATE.aon.arcs = arcs;
    } else {
      var d = buildAOA(STATE.acts);
      aoaAutoLayout(d.nodes, d.arcs);
      STATE.aoa = { nodes:d.nodes, arcs:d.arcs, nextNodeId:d.nodes.length + 1 };
    }
    STATE.net.result = null;
    STATE.net.banner = 'Answer shown — this is one correct diagram. Others are possible: any drawing with the same precedence is right.';
    STATE.net.neutral = true;
    renderNet();
  });

  /* chips */
  var chips = body.querySelectorAll('[data-chip]');
  for(var c = 0; c < chips.length; c++) chips[c].addEventListener('click', function(){
    var id = this.dataset.chip;
    if(this.classList.contains('placed')) return;
    STATE.net.armed = STATE.net.armed === id ? null : id;
    STATE.net.selNode = null;
    renderNet();
  });

  /* canvas clicks */
  var svg = body.querySelector('.canvasWrap svg');
  if(!svg) return;

  on('aonTidy', function(){ STATE.aon.pos = {}; renderNet(); });

  var hits = svg.querySelectorAll('[data-node]');
  for(var i = 0; i < hits.length; i++) hits[i].addEventListener('click', function(e){
    e.stopPropagation();
    if(NET_SUPPRESS_CLICK){ NET_SUPPRESS_CLICK = false; return; }   /* that was a drag, not a click */
    var raw = this.dataset.node, id = STATE.notation === 'AON' ? raw : +raw;
    if(STATE.notation === 'AON'){
      if(STATE.net.selNode == null){ STATE.net.selNode = id; }
      else if(STATE.net.selNode === id){ STATE.net.selNode = null; }
      else {
        var from = STATE.net.selNode, dup = false;
        for(var k = 0; k < STATE.aon.arcs.length; k++)
          if(STATE.aon.arcs[k].from === from && STATE.aon.arcs[k].to === id) dup = true;
        if(!dup) STATE.aon.arcs.push({ from:from, to:id });
        STATE.net.selNode = null; STATE.net.result = null;
      }
    } else {
      if(STATE.net.armed){
        if(STATE.net.selNode == null) STATE.net.selNode = id;
        else if(STATE.net.selNode === id) STATE.net.selNode = null;
        else {
          STATE.aoa.arcs.push({ from:STATE.net.selNode, to:id,
                                act: STATE.net.armed === '__dummy' ? null : STATE.net.armed });
          STATE.net.armed = null; STATE.net.selNode = null; STATE.net.result = null;
        }
      } else {
        STATE.net.selNode = STATE.net.selNode === id ? null : id;
      }
    }
    renderNet();
  });

  var arcHits = svg.querySelectorAll('[data-arc]');
  for(i = 0; i < arcHits.length; i++) arcHits[i].addEventListener('click', function(e){
    e.stopPropagation();
    var k = +this.dataset.arc;
    if(STATE.notation === 'AON') STATE.aon.arcs.splice(k, 1);
    else STATE.aoa.arcs.splice(k, 1);
    STATE.net.result = null;
    renderNet();
  });

  svg.addEventListener('click', function(){
    if(STATE.net.selNode != null || STATE.net.armed){ STATE.net.selNode = null; STATE.net.armed = null; renderNet(); }
  });

  /* dragging — AOA events are circles, AON activity boxes are rects.
     Pointer events cover a mouse, a finger and a pen alike. */
  if(STATE.notation === 'AOA' && STATE.mode !== 'guided'){
    installNetDrag();
    var circles = svg.querySelectorAll('circle[data-node]');
    for(i = 0; i < circles.length; i++) circles[i].addEventListener('pointerdown', function(e){
      var id = +this.dataset.node, n = null;
      for(var k = 0; k < STATE.aoa.nodes.length; k++) if(STATE.aoa.nodes[k].id === id) n = STATE.aoa.nodes[k];
      if(!n) return;
      startNetDrag(svg, e, n, this);
    });
  }
  if(STATE.notation === 'AON'){
    installNetDrag();
    var lay = aonPositions();
    var rects = svg.querySelectorAll('rect[data-node]');
    for(i = 0; i < rects.length; i++) rects[i].addEventListener('pointerdown', function(e){
      var id = this.dataset.node;
      if(!lay.pos[id]) return;
      if(!STATE.aon.pos[id]) STATE.aon.pos[id] = { x:lay.pos[id].x, y:lay.pos[id].y };
      startNetDrag(svg, e, STATE.aon.pos[id], this);
    });
  }
}

/* Dragging redraws the canvas, which destroys the element the drag started on.
   The listeners therefore live on the window, and NET_DRAG.n is a live reference
   into STATE.aoa.nodes so it keeps pointing at the right event across redraws. */
var NET_DRAG = null, NET_SUPPRESS_CLICK = false;
function netPoint(svg, evt){
  var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  return { x:(evt.clientX - r.left) / r.width * vb.width,
           y:(evt.clientY - r.top) / r.height * vb.height };
}
function startNetDrag(svg, e, target, el){
  if(e.button) return;                        /* main button, finger or pen only */
  var p = netPoint(svg, e), touch = e.pointerType !== 'mouse';
  NET_DRAG = { n:target, dx:p.x - target.x, dy:p.y - target.y, moved:false,
               x0:e.clientX, y0:e.clientY,
               /* a fingertip wobbles during a tap: ignore the first few pixels so a
                  tap still selects the node instead of nudging it */
               slop: touch ? 8 : 0, el: touch ? el : null };
  e.preventDefault();
}
function installNetDrag(){
  if(installNetDrag.done) return;
  installNetDrag.done = true;
  /* Clear the suppression on every fresh press (capture phase, so this runs
     before the node's own handler). Without it, a drag that ends off the box
     leaves the flag set and swallows the user's next real click. */
  window.addEventListener('pointerdown', function(){ NET_SUPPRESS_CLICK = false; }, true);
  window.addEventListener('pointermove', function(e){
    if(!NET_DRAG) return;
    if(!NET_DRAG.moved && Math.abs(e.clientX - NET_DRAG.x0) + Math.abs(e.clientY - NET_DRAG.y0) <= NET_DRAG.slop) return;
    var svg = $('tabBody') ? $('tabBody').querySelector('.canvasWrap svg') : null;
    if(!svg) return;
    var p = netPoint(svg, e);
    NET_DRAG.n.x = Math.max(30, p.x - NET_DRAG.dx);
    NET_DRAG.n.y = Math.max(30, p.y - NET_DRAG.dy);
    NET_DRAG.moved = true;
    renderNet();
    /* iPad/iPhone send the rest of a touch to the element the finger first landed
       on. The redraw has just replaced it, so put the old one back, invisible,
       or the remaining moves would never reach these window listeners. */
    var el = NET_DRAG.el, fresh = $('tabBody').querySelector('.canvasWrap svg');
    if(el && !el.isConnected && fresh){
      el.style.opacity = '0'; el.style.pointerEvents = 'none';
      fresh.appendChild(el);
    }
  });
  function endDrag(){
    /* a drag ends with a click event on the box — swallow it so releasing the
       mouse does not also select the box or complete an arrow */
    var d = NET_DRAG;
    if(d && d.moved) NET_SUPPRESS_CLICK = true;
    NET_DRAG = null;
    if(d && d.moved && d.el) renderNet();     /* clear away the invisible touch element */
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  /* a finger that starts on a node moves the node, not the page */
  window.addEventListener('touchmove', function(e){ if(NET_DRAG) e.preventDefault(); }, { passive:false });
}

/* =====================================================================
   TAB 2 — CRITICAL PATH  (deck slides 17-28)
   Reads STATE.acts; draws its own read-only layered network so the module
   works before the tab-1 canvases exist.
   ===================================================================== */

/* A signature of the data the module depends on — when it changes, the
   student's progress through the passes is no longer meaningful. */
function actsSignature(){
  return STATE.acts.map(function(a){
    return a.id + ':' + a.dur + '[' + (a.preds || []).join(',') + ']';
  }).join(' ') + '|' + STATE.mode;
}
function ensureCPState(){
  var sig = actsSignature();
  if(!STATE.cp || STATE.cp.sig !== sig){
    STATE.cp = { sig:sig, step:-1, practice:'forward', banner:null, neutral:false };
  }
}

/* Longest-path layering: layer(x) = 0 with no predecessors, else max(layer(preds)) + 1. */
function layersOf(acts){
  var order = topoOrder(acts), known = knownIds(acts), byId = {}, L = {}, i, j;
  for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];
  for(i = 0; i < order.length; i++){
    var x = order[i], ps = realPreds(byId[x], known), m = -1;
    for(j = 0; j < ps.length; j++) if(L[ps[j]] > m) m = L[ps[j]];
    L[x] = ps.length ? m + 1 : 0;
  }
  return L;
}

/* The activity-on-node network with the ES | t | EF over LS | name | LF box
   from deck slide 22.  vis controls how much of each box is filled in. */
function cpNetworkSVG(cpm, vis, nowId){
  var acts = STATE.acts, L = layersOf(acts), byId = {}, i, j;
  for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];

  var NW = 122, NH = 64, GX = 68, GY = 24, M = 16;
  var cols = {}, maxLayer = 0;
  for(i = 0; i < acts.length; i++){
    var l = L[acts[i].id];
    if(!cols[l]) cols[l] = [];
    cols[l].push(acts[i].id);
    if(l > maxLayer) maxLayer = l;
  }
  var tallest = 0;
  for(i = 0; i <= maxLayer; i++) if(cols[i] && cols[i].length > tallest) tallest = cols[i].length;

  var W = M * 2 + (maxLayer + 1) * NW + maxLayer * GX;
  var H = M * 2 + tallest * NH + (tallest - 1) * GY;
  var pos = {};
  for(i = 0; i <= maxLayer; i++){
    var list = cols[i] || [], colH = list.length * NH + (list.length - 1) * GY;
    var y0 = M + (H - M * 2 - colH) / 2;
    for(j = 0; j < list.length; j++)
      pos[list[j]] = { x: M + i * (NW + GX), y: y0 + j * (NH + GY) };
  }

  var crit = {}, ca = criticalActivities(cpm);
  for(i = 0; i < ca.length; i++) crit[ca[i]] = true;

  /* arcs first, so the boxes sit on top */
  var g = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker>' +
          '<marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
          '<path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs>';
  var known = knownIds(acts);
  for(i = 0; i < acts.length; i++){
    var ps = realPreds(acts[i], known);
    for(j = 0; j < ps.length; j++){
      var a = pos[ps[j]], b = pos[acts[i].id];
      if(!a || !b) continue;
      /* route around any box in between, so a long arrow is not mistaken for
         one ending at the box it passes */
      var d = routedArcPath(a, b, NW, NH, pos, ps[j], acts[i].id);
      var isCrit = crit[ps[j]] && crit[acts[i].id];
      g += '<path d="' + d + '" fill="none" stroke="' + (isCrit ? '#16a34a' : '#9ca3af') +
           '" stroke-width="' + (isCrit ? 2.6 : 1.6) + '" marker-end="url(#' + (isCrit ? 'ahc' : 'ah') + ')"/>';
    }
  }

  /* boxes */
  var c1 = 40, c2 = 44;                       /* column widths inside the box */
  for(i = 0; i < acts.length; i++){
    var id = acts[i].id, p = pos[id], isC = crit[id], isNow = id === nowId;
    var fill = isNow ? '#fef9c3' : (isC ? '#f0fdf4' : '#ffffff');
    var stroke = isNow ? '#d97706' : (isC ? '#16a34a' : '#cbd5e1');
    var sw = (isNow || isC) ? 2.4 : 1.4;
    g += '<rect x="' + p.x + '" y="' + p.y + '" width="' + NW + '" height="' + NH + '" rx="7" fill="' + fill +
         '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    g += '<line x1="' + p.x + '" y1="' + (p.y + NH / 2) + '" x2="' + (p.x + NW) + '" y2="' + (p.y + NH / 2) + '" stroke="#e5e7eb"/>';
    g += '<line x1="' + (p.x + c1) + '" y1="' + p.y + '" x2="' + (p.x + c1) + '" y2="' + (p.y + NH) + '" stroke="#e5e7eb"/>';
    g += '<line x1="' + (p.x + c1 + c2) + '" y1="' + p.y + '" x2="' + (p.x + c1 + c2) + '" y2="' + (p.y + NH) + '" stroke="#e5e7eb"/>';

    var showF = vis.showF[id], showB = vis.showB[id];
    function cell(cx, cy, txt, bold, col){
      return '<text x="' + cx + '" y="' + cy + '" text-anchor="middle" font-size="14.5" ' +
             'font-weight="' + (bold ? 800 : 600) + '" fill="' + (col || '#1f2937') + '">' + esc(txt) + '</text>';
    }
    var topY = p.y + 21, botY = p.y + 53;
    g += cell(p.x + c1 / 2,        topY, showB ? numFmt(cpm.LS[id]) : '', false, '#6b7280');
    g += cell(p.x + c1 + c2 / 2,   topY, id, true, isC ? '#16a34a' : '#1f2937');
    g += cell(p.x + c1 + c2 + 19,  topY, showB ? numFmt(cpm.LF[id]) : '', false, '#6b7280');
    g += cell(p.x + c1 / 2,        botY, showF ? numFmt(cpm.ES[id]) : '', false, '#2563eb');
    g += cell(p.x + c1 + c2 / 2,   botY, numFmt(byId[id].dur), false, '#1f2937');
    g += cell(p.x + c1 + c2 + 19,  botY, showF ? numFmt(cpm.EF[id]) : '', false, '#2563eb');
  }

  return '<div class="canvasWrap"><svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
         '" xmlns="http://www.w3.org/2000/svg">' + g + '</svg></div>' +
         '<div class="legendRow"><span><i style="background:#f0fdf4;border:2px solid #16a34a"></i>critical (zero slack)</span>' +
         '<span>Box layout follows deck slide 22: <b>LS · name · LF</b> on top, <b>ES · t · EF</b> below.</span></div>';
}

/* ---- the arithmetic, spelled out ---- */
function forwardText(x, cpm, byId, known){
  var ps = realPreds(byId[x], known), d = byId[x].dur, i, terms = [], vals = [];
  if(!ps.length)
    return '<code>ES(' + x + ') = 0</code> — nothing has to finish first. ' +
           '<code>EF(' + x + ') = 0 + ' + numFmt(d) + ' = ' + numFmt(cpm.EF[x]) + '</code>';
  for(i = 0; i < ps.length; i++){ terms.push('EF(' + ps[i] + ')'); vals.push(numFmt(cpm.EF[ps[i]])); }
  var lhs = ps.length === 1
    ? 'ES(' + x + ') = ' + terms[0] + ' = ' + numFmt(cpm.ES[x])
    : 'ES(' + x + ') = max(' + terms.join(', ') + ') = max(' + vals.join(', ') + ') = ' + numFmt(cpm.ES[x]);
  return '<code>' + lhs + '</code>, so <code>EF(' + x + ') = ' + numFmt(cpm.ES[x]) + ' + ' +
         numFmt(d) + ' = ' + numFmt(cpm.EF[x]) + '</code>';
}
function backwardText(x, cpm, byId, succ){
  var ss = succ[x], d = byId[x].dur, i, terms = [], vals = [];
  if(!ss.length)
    return '<code>LF(' + x + ') = ' + numFmt(cpm.duration) + '</code> — nothing follows it, so it may finish as late as the project. ' +
           '<code>LS(' + x + ') = ' + numFmt(cpm.duration) + ' − ' + numFmt(d) + ' = ' + numFmt(cpm.LS[x]) + '</code>';
  for(i = 0; i < ss.length; i++){ terms.push('LS(' + ss[i] + ')'); vals.push(numFmt(cpm.LS[ss[i]])); }
  var lhs = ss.length === 1
    ? 'LF(' + x + ') = ' + terms[0] + ' = ' + numFmt(cpm.LF[x])
    : 'LF(' + x + ') = min(' + terms.join(', ') + ') = min(' + vals.join(', ') + ') = ' + numFmt(cpm.LF[x]);
  return '<code>' + lhs + '</code>, so <code>LS(' + x + ') = ' + numFmt(cpm.LF[x]) + ' − ' +
         numFmt(d) + ' = ' + numFmt(cpm.LS[x]) + '</code>';
}

/* ---- which numbers are currently on screen ---- */
function cpVisibility(cpm){
  var order = cpm.order, n = order.length, showF = {}, showB = {}, i;
  if(STATE.mode === 'guided'){
    var s = STATE.cp.step;
    for(i = 0; i <= s && i < n; i++) showF[order[i]] = true;
    if(s >= n) for(i = 0; i <= s - n && i < n; i++) showB[order[n - 1 - i]] = true;
  } else {
    if(STATE.cp.practice !== 'forward') for(i = 0; i < n; i++) showF[order[i]] = true;
    if(STATE.cp.practice === 'done')    for(i = 0; i < n; i++) showB[order[i]] = true;
  }
  return { showF:showF, showB:showB };
}
function cpNowId(cpm){
  if(STATE.mode !== 'guided') return null;
  var n = cpm.order.length, s = STATE.cp.step;
  if(s < 0 || s >= 2 * n) return null;
  return s < n ? cpm.order[s] : cpm.order[n - 1 - (s - n)];
}

/* ---- tables ---- */
function cpActivityTable(cpm, vis){
  var practice = STATE.mode === 'practice', ph = STATE.cp.practice;
  var crit = {}, ca = criticalActivities(cpm), i;
  for(i = 0; i < ca.length; i++) crit[ca[i]] = true;
  var nowId = cpNowId(cpm);

  var h = '<table class="dataT"><tr><th>Activity</th><th>t</th><th>ES</th><th>EF</th>' +
          '<th>LS</th><th>LF</th><th>Slack</th></tr>';
  for(i = 0; i < STATE.acts.length; i++){
    var a = STATE.acts[i], id = a.id;
    var cls = (id === nowId) ? 'now' : (crit[id] && (!practice || ph === 'done') ? 'crit' : '');
    h += '<tr class="' + cls + '"><td class="jb">' + esc(id) + '</td><td>' + numFmt(a.dur) + '</td>';
    if(practice){
      var fwdDone = ph !== 'forward';
      h += cpCell('ES', id, cpm, fwdDone, false);
      h += cpCell('EF', id, cpm, fwdDone, false);
      var bwdOpen = ph === 'backward' || ph === 'done';
      h += cpCell('LS', id, cpm, ph === 'done', !bwdOpen);
      h += cpCell('LF', id, cpm, ph === 'done', !bwdOpen);
      h += cpCell('SL', id, cpm, ph === 'done', !bwdOpen);
    } else {
      h += '<td>' + (vis.showF[id] ? numFmt(cpm.ES[id]) : '') + '</td>';
      h += '<td>' + (vis.showF[id] ? numFmt(cpm.EF[id]) : '') + '</td>';
      h += '<td>' + (vis.showB[id] ? numFmt(cpm.LS[id]) : '') + '</td>';
      h += '<td>' + (vis.showB[id] ? numFmt(cpm.LF[id]) : '') + '</td>';
      h += '<td>' + (vis.showB[id] ? numFmt(cpm.slack[id]) : '') + '</td>';
    }
    h += '</tr>';
  }
  return h + '</table>';
}
/* one practice cell: an input while its phase is open, the answer once passed, greyed before */
function cpCell(kind, id, cpm, solved, locked){
  if(locked) return '<td class="locked">·</td>';
  if(solved){
    var v = kind === 'SL' ? cpm.slack[id] : cpm[kind][id];
    return '<td>' + numFmt(v) + '</td>';
  }
  return '<td><input type="number" step="any" data-cp="' + kind + '" data-id="' + esc(id) + '"></td>';
}

function cpPathTable(cpm){
  var byId = {}, i;
  for(i = 0; i < STATE.acts.length; i++) byId[STATE.acts[i].id] = STATE.acts[i];
  var paths = enumeratePaths(STATE.acts);
  var rows = paths.map(function(p){
    return { s:p, L:pathLength(p, byId, function(a){ return a.dur; }) };
  }).sort(function(x, y){ return y.L - x.L; });
  var show = STATE.mode !== 'practice' || STATE.cp.practice === 'done';
  var h = '<table class="dataT"><tr><th>Path</th><th>Length</th><th>Slack</th></tr>';
  for(i = 0; i < rows.length; i++){
    var isC = Math.abs(rows[i].L - cpm.duration) < 1e-9;
    h += '<tr class="' + (isC && show ? 'crit' : '') + '"><td class="jb">' + esc(rows[i].s.join(' – ')) + '</td>' +
         '<td>' + numFmt(rows[i].L) + '</td><td>' + (show ? numFmt(cpm.duration - rows[i].L) : '') + '</td></tr>';
  }
  return h + '</table>';
}

var CP_DEFS =
  '<div class="defs">' +
  '<div><b>ES</b> — earliest start. The earliest an activity can begin, assuming every preceding activity <i>finishes</i> as early as possible.</div>' +
  '<div><b>EF</b> — earliest finish. <code>EF = ES + t</code></div>' +
  '<div><b>LS</b> — latest start without delaying the project. <code>LS = LF − t</code></div>' +
  '<div><b>LF</b> — latest an activity can <i>finish</i> without delaying the project.</div>' +
  '<div><b>Slack</b> — spare time. <code>Slack = LS − ES = LF − EF</code>. Zero slack means the activity is on the critical path.</div>' +
  '</div>';

/* ---- the module ---- */
function renderCP(){
  ensureCPState();
  var errs = validateActs(STATE.acts);
  if(errs.length){
    $('tabBody').innerHTML = '<h2>Critical path</h2><p class="hint">Fix the activity table above first.</p>';
    return;
  }
  var cpm = runCPM(STATE.acts), byId = {}, known = knownIds(STATE.acts), succ = successors(STATE.acts), i;
  for(i = 0; i < STATE.acts.length; i++) byId[STATE.acts[i].id] = STATE.acts[i];
  var n = cpm.order.length, vis = cpVisibility(cpm), nowId = cpNowId(cpm);

  var h = '<h2>Critical path</h2>';
  if(STATE.cp.banner) h += '<div class="okNote' + (STATE.cp.neutral ? ' neutral' : '') + '">' + STATE.cp.banner + '</div>';

  if(STATE.mode === 'guided'){
    var s = STATE.cp.step;
    h += '<div class="row noprint">' +
         '<button id="cpBack"' + (s < 0 ? ' disabled' : '') + '>◀ Back</button>' +
         '<button class="primary" id="cpStep"' + (s >= 2 * n ? ' disabled' : '') + '>' +
             (s < 0 ? 'Start the forward pass ▶' : 'Step ▶') + '</button>' +
         '<button id="cpAll">Run to the end</button>' +
         '<button id="cpReset">↺ Reset</button>' +
         '<span class="hint">' + (s < 0 ? 'Not started' :
             s < n ? 'Forward pass — activity ' + (s + 1) + ' of ' + n :
             s < 2 * n ? 'Backward pass — activity ' + (s - n + 1) + ' of ' + n : 'Complete') + '</span></div>';
    if(s < 0){
      h += '<div class="explain">The <b>forward pass</b> sweeps left to right and finds how early each activity can happen. ' +
           'The <b>backward pass</b> then sweeps right to left and finds how late it may happen without pushing the project out. ' +
           'The gap between the two is slack.</div>';
    } else if(s < n){
      h += '<div class="explain"><b>Forward pass · ' + esc(nowId) + '</b><br>' + forwardText(nowId, cpm, byId, known) + '</div>';
    } else if(s < 2 * n){
      if(s === n)
        h += '<div class="explain">The forward pass gives a project duration of <b>' + numFmt(cpm.duration) + ' days</b>. ' +
             'The backward pass now works back from that figure.</div>';
      h += '<div class="explain"><b>Backward pass · ' + esc(nowId) + '</b><br>' + backwardText(nowId, cpm, byId, succ) + '</div>';
    } else {
      h += '<div class="explain">Both passes are done. <code>Slack = LS − ES</code>, and the activities with ' +
           '<b>zero slack</b> form the critical path: <b>' + criticalActivities(cpm).join(' – ') + '</b>. ' +
           'Delay any one of them and the whole project slips.</div>';
    }
  } else {
    var ph = STATE.cp.practice;
    if(ph === 'forward'){
      h += '<div class="practice"><div class="q">Step 1 — the forward pass</div>' +
           'Fill in <b>ES</b> and <b>EF</b> for every activity, working left to right. ' +
           '<code>ES = max(EF of predecessors)</code>, <code>EF = ES + t</code>.' +
           '<div class="row"><button class="primary" id="cpCheckF">Check</button>' +
           '<button id="cpRevealF">Show answer</button></div>' +
           '<div class="hint">The path table stays hidden until you answer — it gives the durations away.</div>' +
           '<div class="fb" id="cpFb"></div></div>';
    } else if(ph === 'backward'){
      h += '<div class="practice"><div class="q">Step 2 — the backward pass</div>' +
           'Now fill in <b>LS</b>, <b>LF</b> and <b>Slack</b>, working right to left. ' +
           '<code>LF = min(LS of successors)</code>, <code>LS = LF − t</code>, <code>Slack = LS − ES</code>. ' +
           'The last activities may finish as late as day <b>' + numFmt(cpm.duration) + '</b>.' +
           '<div class="row"><button class="primary" id="cpCheckB">Check</button>' +
           '<button id="cpRevealB">Show answer</button></div>' +
           '<div class="fb" id="cpFb"></div></div>';
    }
  }

  h += cpNetworkSVG(cpm, vis, nowId);
  h += '<div class="cols2"><div>' + cpActivityTable(cpm, vis) + '</div>';
  if(STATE.mode !== 'practice' || STATE.cp.practice === 'done')
    h += '<div>' + cpPathTable(cpm) + '</div>';
  h += '</div>';
  h += '<h2 style="margin-top:18px;font-size:17px">What the four numbers mean</h2>' + CP_DEFS;
  $('tabBody').innerHTML = h;
  wireCP(cpm, n);
}

function wireCP(cpm, n){
  function on(id, fn){ var e = $(id); if(e) e.addEventListener('click', fn); }
  on('cpStep',  function(){ STATE.cp.step = Math.min(2 * n, STATE.cp.step + 1); STATE.cp.banner = null; renderCP(); });
  on('cpBack',  function(){ STATE.cp.step = Math.max(-1, STATE.cp.step - 1); STATE.cp.banner = null; renderCP(); });
  on('cpAll',   function(){ STATE.cp.step = 2 * n; STATE.cp.banner = null; renderCP(); });
  on('cpReset', function(){ STATE.cp.step = -1; STATE.cp.banner = null; renderCP(); });
  on('cpCheckF',  function(){ cpCheck('forward', cpm); });
  on('cpCheckB',  function(){ cpCheck('backward', cpm); });
  on('cpRevealF', function(){
    STATE.cp.practice = 'backward';
    STATE.cp.banner = 'Answer shown — ES and EF are filled in below. Project duration <b>' + numFmt(cpm.duration) + ' days</b>.';
    STATE.cp.neutral = true; renderCP();
  });
  on('cpRevealB', function(){
    STATE.cp.practice = 'done';
    STATE.cp.banner = 'Answer shown — the critical path is <b>' + criticalActivities(cpm).join(' – ') + '</b>.';
    STATE.cp.neutral = true; renderCP();
  });
}

function cpCheck(phase, cpm){
  var ins = $('tabBody').querySelectorAll('input[data-cp]'), allGood = true, i, wrong = 0;
  for(i = 0; i < ins.length; i++){
    var inp = ins[i], kind = inp.dataset.cp, id = inp.dataset.id;
    var want = kind === 'SL' ? cpm.slack[id] : cpm[kind][id];
    var ok = Math.abs(parseFloat(inp.value) - want) < 0.011;
    inp.className = ok ? 'good' : 'badIn';
    if(!ok){ allGood = false; wrong++; }
  }
  if(!allGood){
    var fb = $('cpFb');
    if(fb){
      fb.className = 'fb badFb';
      fb.textContent = wrong + (wrong === 1 ? ' box is' : ' boxes are') + ' not right yet — the red ones. ' +
        (phase === 'forward'
          ? 'Remember ES is the LARGEST of the predecessors’ EF values, because every one of them must finish first.'
          : 'Remember LF is the SMALLEST of the successors’ LS values, because the earliest of them sets the deadline.');
    }
    return;
  }
  if(phase === 'forward'){
    STATE.cp.practice = 'backward';
    STATE.cp.banner = '✓ Forward pass correct. The project takes <b>' + numFmt(cpm.duration) +
                      ' days</b> — that is the largest EF in the table. Now work backwards.';
    STATE.cp.neutral = false;
  } else {
    STATE.cp.practice = 'done';
    STATE.cp.banner = '✓ All correct. The critical path is <b>' + criticalActivities(cpm).join(' – ') +
                      '</b> — the activities with zero slack.';
    STATE.cp.neutral = false;
  }
  renderCP();
}

/* ---------------------------------------------------------------
   Random problem generator (spec 9.4)
   --------------------------------------------------------------- */
function randomProblem(difficulty){
  var cfg = { easy:{ n:[4,5], p:0.35 }, medium:{ n:[6,8], p:0.35 }, hard:{ n:[8,11], p:0.4 } }[difficulty];
  var allowTie = difficulty === 'hard';

  for(var attempt = 0; attempt < 400; attempt++){
    var n = cfg.n[0] + Math.floor(Math.random() * (cfg.n[1] - cfg.n[0] + 1));
    var acts = [], i, j;
    for(i = 0; i < n; i++){
      var preds = [];
      for(j = 0; j < i; j++) if(Math.random() < cfg.p) preds.push('abcdefghijkl'[j]);
      acts.push({ id:'abcdefghijkl'[i], preds:preds, dur:1 + Math.floor(Math.random() * 12) });
    }
    /* keep only immediate predecessors so the table is a clean cover */
    var cl = closure(acts);
    for(i = 0; i < acts.length; i++){
      acts[i].preds = acts[i].preds.filter(function(p){
        return !acts[i].preds.some(function(q){ return q !== p && cl[q] && cl[q][p]; });
      });
    }
    if(!isOneComponent(acts)) continue;

    var paths = enumeratePaths(acts);
    if(paths.length < 2) continue;
    var byId = {};
    for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];
    var lens = paths.map(function(p){ return pathLength(p, byId, function(a){ return a.dur; }); });
    var mx = Math.max.apply(null, lens);
    var ties = lens.filter(function(L){ return Math.abs(L - mx) < 1e-9; }).length;
    if(ties > 1 && !allowTie) continue;
    return acts;
  }
  return null;
}

/* Union-find over precedence edges — the network must be one piece. */
function isOneComponent(acts){
  var parent = {}, i, j;
  function find(x){ while(parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; }
  function union(a, b){ parent[find(a)] = find(b); }
  for(i = 0; i < acts.length; i++) parent[acts[i].id] = acts[i].id;
  for(i = 0; i < acts.length; i++)
    for(j = 0; j < acts[i].preds.length; j++) union(acts[i].id, acts[i].preds[j]);
  var roots = {}, count = 0;
  for(i = 0; i < acts.length; i++){ var r = find(acts[i].id); if(!roots[r]){ roots[r] = 1; count++; } }
  return count === 1;
}

/* ---------------------------------------------------------------
   Wiring
   --------------------------------------------------------------- */
function redrawAll(rebuildEditor){
  if(rebuildEditor !== false) renderEditor();
  var note = PRESETS[STATE.presetKey];
  $('presetNote').innerHTML = note && note.note ? '<div class="presetNote">' + note.note + '</div>' : '';
  renderValidation();
  renderTabBody();
}

function segWire(id, fn){
  $(id).addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if(!b) return;
    var kids = $(id).children;
    for(var i = 0; i < kids.length; i++) kids[i].className = kids[i] === b ? 'on' : '';
    fn(b.dataset.v);
  });
}

function initShell(){
  fillPresetSelect();
  renderTabBar();
  $('editor').addEventListener('input', onEditorInput);
  $('editor').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-del]') : null;
    if(!b) return;
    STATE.acts.splice(+b.dataset.del, 1);
    resetDiagrams(); markCustom(); redrawAll();
  });
  $('preset').addEventListener('change', function(e){
    if(e.target.value !== 'custom') applyPreset(e.target.value);
  });
  segWire('segMode', function(v){ STATE.mode = v; renderTabBody(); });
  $('btnAdd').addEventListener('click', function(){
    var used = {}, i;
    for(i = 0; i < STATE.acts.length; i++) used[STATE.acts[i].id] = 1;
    var id = 'a';
    for(i = 0; i < 26; i++) if(!used['abcdefghijklmnopqrstuvwxyz'[i]]){ id = 'abcdefghijklmnopqrstuvwxyz'[i]; break; }
    STATE.acts.push({ id:id, preds:[], dur:1 });
    resetDiagrams(); markCustom(); redrawAll();
  });
  $('btnRandom').addEventListener('click', function(){
    var acts = randomProblem($('selDiff').value);
    /* shown on the page: alert() boxes may be blocked when the file is opened on an iPad/iPhone */
    if(!acts){ $('validation').innerHTML = '<ul class="errList"><li class="warn">Could not build a problem meeting the constraints — press Generate problem again.</li></ul>'; return; }
    STATE.acts = acts;
    resetDiagrams(); markCustom(); redrawAll();
  });
  $('btnPrint').addEventListener('click', function(){ window.print(); });

  applyPreset('L1');
}

/* ---- test runner in the page ----
   Triggered by ?test or #test. Both are supported because some viewers
   (and the in-app preview pane) drop the query string from a file:// URL. */
function showAcceptanceTests(){
  var res = runAcceptanceTests(), html = '';
  for(var i = 0; i < res.lines.length; i++){
    var L = res.lines[i];
    if(L.group){ html += '<h3>' + L.group + '</h3>'; continue; }
    html += L.ok
      ? '<div class="p">  ok   ' + L.name + '  =  ' + L.got + '</div>'
      : '<div class="f">  FAIL ' + L.name + '  got ' + L.got + ', want ' + L.want + '</div>';
  }
  var tally = '<div class="tally ' + (res.fail ? 'bad' : 'ok') + '">' +
      (res.fail ? res.fail + ' FAILED, ' + res.pass + ' passed'
                : 'all ' + res.pass + ' checks passed') + '</div>';
  document.getElementById('testOut').innerHTML = tally + html;
  document.getElementById('testCard').style.display = '';
  document.getElementById('app').style.display = 'none';
  return res;
}

if(/[?&]test\b/.test(location.search) || /^#test\b/.test(location.hash)) showAcceptanceTests();
else initShell();
