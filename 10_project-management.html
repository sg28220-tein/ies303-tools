<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Management — IES 303</title>
<!--
  Project management teaching tool — IES 303 Operations Management (SIIT), Lecture 10.
  Standalone page: open directly in any browser, no server needed.

  Two modules over one shared activity table, each in Guided and Practice mode:
    Tab 1  Network diagram (AOA + AON)     deck slides 4-16
    Tab 2  Critical path                   deck slides 17-28

  Slide numbers refer to "10 Project Management.pptx" (44 slides).
  Units: DAYS throughout (the deck mixes days and weeks; the tool standardises).

  Add ?test (or #test) to the URL to run the acceptance suite in the page.

  Probabilistic time estimates (PERT) and crashing were built and then removed
  at the instructor's request; the full four-module version is kept alongside as
  10_project-management_ARCHIVE_with-PERT-and-crashing.html.

  Correction made against the deck (verified by reading the .pptx directly):
    - slide 19's ES definition says preceding activities "start at" their
      earliest finish time; the tool says "finishes as early as possible"
    - slide 28 is correct and DOES have an LF column (slides 26/27 do not)
-->
<style>
  :root{
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --accent-soft:#eff6ff;
    --ok:#16a34a;     --ok-soft:#f0fdf4;
    --warn:#d97706;   --warn-soft:#fffbeb;
    --bad:#dc2626;    --bad-soft:#fef2f2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);background:#fafafa;font-size:16px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  header h1{margin:0;font-size:29px;font-weight:700}
  header .sub{margin:4px 0 20px;color:var(--muted)}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{margin:0 0 10px;font-size:19px}
  .hint{color:var(--muted);font-size:13.5px}
  .hidden{display:none !important}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
  label.fld{display:flex;align-items:center;gap:7px;font-weight:600;font-size:15px}
  select,input[type=text],input[type=number]{font:inherit;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  input[type=number]{width:84px;text-align:center}
  button{font:inherit;font-weight:600;padding:8px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:8px 14px;background:#fff;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}

  /* --- module tab bar --- */
  .tabbar{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px;background:#fff}
  .tabbar button{flex:1;border:none;border-radius:0;padding:13px 10px;background:#fff;font-weight:700;font-size:15.5px;border-right:1px solid var(--line);line-height:1.25}
  .tabbar button:last-child{border-right:none}
  .tabbar button .tn{display:block;font-size:12px;font-weight:600;color:var(--muted)}
  .tabbar button.on{background:var(--accent);color:#fff}
  .tabbar button.on .tn{color:#dbeafe}

  /* --- activity editor --- */
  table.editT{border-collapse:collapse;margin:10px 0}
  table.editT th{background:#f8fafc;color:var(--muted);font-size:12.5px;font-weight:600;padding:6px 9px;border:1px solid var(--line);white-space:nowrap}
  table.editT th.grp{background:var(--accent-soft);color:var(--accent)}
  table.editT td{border:1px solid var(--line);padding:3px 4px;text-align:center}
  table.editT input{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 4px;text-align:center;font:inherit;width:74px}
  table.editT input.id{width:78px;font-weight:700}
  table.editT input.preds{width:118px}
  table.editT input:focus{border-color:var(--accent);background:#fff;outline:none}
  table.editT input:disabled{color:var(--muted);background:#f8fafc}
  table.editT td.calc{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14.5px}
  table.editT td.sw span{display:block;width:12px;height:12px;border-radius:4px;margin:0 auto}
  table.editT button.del{padding:3px 9px;font-size:13px;color:var(--bad);border-color:transparent;background:transparent}

  /* --- validation list --- */
  ul.errList{list-style:none;margin:8px 0 0;padding:0}
  ul.errList li{padding:7px 12px;border-radius:8px;margin-bottom:5px;font-size:14.5px}
  ul.errList li.err{background:var(--bad-soft);color:var(--bad);border:1px solid #fecaca}
  ul.errList li.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bbf7d0}
  ul.errList li.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #fde68a}

  .presetNote{background:var(--accent-soft);border-radius:10px;padding:10px 15px;margin:8px 0;font-size:14.5px}
  .presetNote b{color:var(--accent)}

  /* --- result tables --- */
  table.dataT{border-collapse:collapse;font-size:15.5px;margin:10px 0}
  table.dataT th{background:#f8fafc;color:var(--muted);font-size:13px;padding:7px 13px;border:1px solid var(--line);white-space:nowrap}
  table.dataT td{padding:6px 13px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
  table.dataT td.jb{text-align:left;font-weight:700;white-space:nowrap}
  table.dataT tr.crit td{background:var(--ok-soft)}
  table.dataT tr.crit td.jb{color:var(--ok)}
  table.dataT tr.now td{background:#fef9c3}
  table.dataT td input{width:72px;font:inherit;font-size:15px;text-align:center;border:1.5px solid var(--line);border-radius:7px;padding:5px 3px}
  table.dataT td input:focus{border-color:var(--accent);outline:none}
  table.dataT td input.good{border-color:var(--ok);background:var(--ok-soft)}
  table.dataT td input.badIn{border-color:var(--bad);background:var(--bad-soft)}
  table.dataT td input:disabled{background:#f8fafc;color:var(--muted)}
  table.dataT td.locked{background:#f8fafc;color:#cbd5e1}

  /* --- panels --- */
  .explain{background:var(--accent-soft);border-radius:10px;padding:13px 18px;margin:12px 0;font-size:16px}
  .explain b{color:var(--accent)}
  .explain code{font-family:Consolas,"Courier New",monospace;font-size:15.5px;background:#fff;padding:1px 5px;border-radius:5px}
  .practice{background:var(--warn-soft);border:1px solid #fde68a;border-radius:10px;padding:14px 18px;margin:12px 0}
  .practice .q{font-weight:700;margin-bottom:8px}
  .fb{margin-top:10px;font-weight:700}
  .fb.good{color:var(--ok)} .fb.badFb{color:var(--bad)}
  .okNote{color:var(--ok);font-weight:700;margin:10px 0;background:var(--ok-soft);border:1px solid #bbf7d0;
          border-radius:10px;padding:11px 16px;font-size:16.5px}
  .okNote.neutral{color:var(--muted);background:#f8fafc;border-color:var(--line)}
  .defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0}
  .defs div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14.5px}
  .defs b{color:var(--accent);font-size:16px}
  .cols2{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}

  /* --- network canvas --- */
  .canvasWrap{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:auto;padding:6px;min-height:300px}
  .canvasWrap svg{display:block}
  .canvasWrap.build{min-height:460px;background:
     linear-gradient(90deg,#f8fafc 1px,transparent 1px) 0 0/28px 28px,
     linear-gradient(#f8fafc 1px,transparent 1px) 0 0/28px 28px,#fff}
  .canvasWrap svg .nodeHit{cursor:pointer}
  .canvasWrap svg .arcHit{cursor:pointer;stroke:transparent;stroke-width:14;fill:none}
  .canvasWrap svg .drag{cursor:grab}

  /* --- canvas with a reference table beside it --- */
  .netLayout{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
  .netLayout > .canvasWrap{flex:1 1 440px;min-width:0}
  .netRef{flex:0 0 auto;position:sticky;top:10px}
  .netRef table.dataT{margin:0;font-size:14px}
  .netRef table.dataT th{padding:5px 9px;font-size:12px}
  .netRef table.dataT td{padding:4px 9px}
  .netRef td.jb{font-size:14px}
  .netRef .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .netRef td.tick{color:var(--ok);font-weight:800;text-align:center}
  .netRef .cap{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 4px 2px}

  /* --- palette --- */
  .palette{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
        border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:15.5px}
  .chip .sw{width:11px;height:11px;border-radius:3px}
  .chip.armed{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.06)}
  .chip.placed{opacity:.35;cursor:default}
  .chip.dummy{border-style:dashed;border-color:#ea580c;color:#ea580c}
  .chip.dummy.armed{background:#fff7ed}
  .legendRow{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-top:6px;align-items:center}
  .legendRow i{width:14px;height:12px;border-radius:3px;display:inline-block;font-style:normal;vertical-align:-1px;margin-right:5px}

  /* --- canvas on touch screens: a finger on a node drags it, and a long press
         does not start a text selection or the iOS callout --- */
  .canvasWrap svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .canvasWrap svg .drag{touch-action:none}

  /* --- mouse only: hover effects (on touch screens they stick after a tap) --- */
  @media (hover:hover){
    button:hover{background:#f3f4f6}
    button.primary:hover{background:#1d4ed8}
    table.editT input:hover{border-color:var(--line);background:#fff}
    table.editT button.del:hover{background:var(--bad-soft);border-color:#fecaca}
    .chip:hover{border-color:var(--accent)}
    .chip.placed:hover{border-color:var(--line)}
  }

  /* --- touch screens (iPad / iPhone); desktop with a mouse is unaffected --- */
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
  @media (pointer:coarse){
    /* iOS zooms in on any text box under 16px and does not zoom back out */
    input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea{font-size:16px}
    button, select, .chip{min-height:44px}
    table.editT button.del{min-height:40px;min-width:40px}
    .canvasWrap svg .arcHit{stroke-width:26}      /* arrows are thin: widen the tap zone */
  }

  /* --- tablet portrait and phones: wide tables scroll inside their own box --- */
  @media screen and (max-width:820px){
    table.dataT, table.editT{display:block;max-width:100%;overflow-x:auto}
    .cols2 > *{min-width:0;max-width:100%}
    /* too narrow for the reference table beside the canvas: put it above, not far below */
    .netRef{order:-1;position:static}
    .netLayout > .canvasWrap{flex-basis:100%}
  }

  /* --- phones --- */
  @media screen and (max-width:640px){
    .wrap{padding:16px 12px 48px}
    .card{padding:16px 12px;border-radius:12px}
    header h1{font-size:24px}
    select{max-width:100%}
    label.fld{flex-wrap:wrap;max-width:100%}
    label.fld select{min-width:0}
    .tabbar button{padding:10px 6px;font-size:14.5px}
    table.dataT th, table.dataT td{padding:6px 8px}
    table.dataT th{white-space:normal;line-height:1.25}
    table.dataT td input{width:60px}
    table.editT input{width:56px}
    table.editT input.id{width:60px}
    table.editT input.preds{width:92px}
    .explain, .practice, .okNote{padding:12px 14px}
  }

  /* --- print --- */
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .noprint{display:none !important}
    .card{box-shadow:none;border-color:#ccc;break-inside:avoid;page-break-inside:avoid}
    .tabbar{display:none}
    header h1{font-size:22px}
    /* the student's completed table is the point of printing, so make the
       editable fields read as plain values rather than empty-looking boxes */
    table.editT input{border-color:transparent;background:transparent;color:var(--ink);-webkit-print-color-adjust:exact}
    table.editT input:disabled{color:var(--ink)}
    table.editT button.del{display:none}
    table.editT th, table.editT td{border-color:#bbb}
    ul.errList li{border-color:#bbb}
  }

  /* --- test report --- */
  #testOut{font-family:Consolas,"Courier New",monospace;font-size:13.5px;white-space:pre-wrap}
  #testOut .p{color:var(--ok)}
  #testOut .f{color:var(--bad);font-weight:700}
  #testOut h3{font-family:"Segoe UI",sans-serif;margin:16px 0 6px;font-size:16px}
  .tally{font-size:18px;font-weight:800;padding:10px 16px;border-radius:10px;margin:12px 0}
  .tally.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #bbf7d0}
  .tally.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #fecaca}
</style>

<body>
<div class="wrap">
  <header>
    <h1>Project Management</h1>
    <p class="sub">Network diagrams · Critical path · IES 303 Lecture 10</p>
  </header>
  <div id="app">
    <nav class="tabbar noprint" id="tabbar"></nav>

    <section class="card" id="setupCard">
      <h2>Project data</h2>
      <div class="row noprint">
        <label class="fld">Example
          <select id="preset"></select>
        </label>
        <span class="seg" id="segMode">
          <button data-v="guided" class="on">Guided — tool explains</button>
          <button data-v="practice">Practice — you answer first</button>
        </span>
        <button id="btnPrint">🖨 Print</button>
      </div>
      <div id="presetNote" class="noprint"></div>
      <div id="editor"></div>
      <div class="row noprint">
        <button id="btnAdd">+ Add activity</button>
        <label class="fld">Random
          <select id="selDiff"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
        </label>
        <button id="btnRandom">Generate problem</button>
        <span class="hint">All times are in <b>days</b>. Predecessors: comma-separated activity names, blank if none.</span>
      </div>

<script id="solverScript">
/* =====================================================================
   PURE ALGORITHMS — no DOM access. Extracted and unit-tested in Node.
   ===================================================================== */

var EPS = 1e-9;
function near(a, b, tol){ return Math.abs(a - b) <= (tol == null ? 1e-9 : tol); }

/* ---------------------------------------------------------------
   Activity record:
     { id, preds:[], dur,
       to, tm, tp, te, variance,     // tab 3 (te/variance may be given directly)
       crashTime,                    // shortest achievable duration
       crashCost }                   // number = flat rate per period,
                                     // array  = cost of 1st, 2nd, ... period
                                     // null   = cannot be crashed
   --------------------------------------------------------------- */

/* Ids that actually exist in this activity set. Predecessor references to
   anything else are ignored here and reported by validateActs(). */
function knownIds(acts){
  var s = {};
  for(var i = 0; i < acts.length; i++) s[acts[i].id] = true;
  return s;
}
function realPreds(act, known){
  var ps = act.preds || [], out = [];
  for(var i = 0; i < ps.length; i++) if(known[ps[i]]) out.push(ps[i]);
  return out;
}

/* { id: [ids of immediate successors] } */
function successors(acts){
  var known = knownIds(acts), out = {}, i, j, ps;
  for(i = 0; i < acts.length; i++) out[acts[i].id] = [];
  for(i = 0; i < acts.length; i++){
    ps = realPreds(acts[i], known);
    for(j = 0; j < ps.length; j++) out[ps[j]].push(acts[i].id);
  }
  return out;
}

/* Topological order, or null if the precedence graph has a cycle. */
function topoOrder(acts){
  var known = knownIds(acts), succ = successors(acts), indeg = {}, queue = [], out = [], i, s;
  for(i = 0; i < acts.length; i++){
    indeg[acts[i].id] = realPreds(acts[i], known).length;
    if(indeg[acts[i].id] === 0) queue.push(acts[i].id);
  }
  while(queue.length){
    var x = queue.shift();
    out.push(x);
    for(i = 0; i < succ[x].length; i++){
      s = succ[x][i];
      if(--indeg[s] === 0) queue.push(s);
    }
  }
  return out.length === acts.length ? out : null;
}

/* Transitive closure: { id: Set(every strict descendant) }. Null on a cycle. */
function closure(acts){
  var order = topoOrder(acts);
  if(!order) return null;
  var succ = successors(acts), out = {}, i, j, k, x, set, sub;
  for(i = order.length - 1; i >= 0; i--){
    x = order[i];
    set = {};
    for(j = 0; j < succ[x].length; j++){
      set[succ[x][j]] = true;
      sub = out[succ[x][j]];
      for(k in sub) if(sub.hasOwnProperty(k)) set[k] = true;
    }
    out[x] = set;
  }
  return out;
}

/* Every path from a start activity (no predecessors) to an end activity
   (no successors), as an array of id arrays. */
function enumeratePaths(acts, cap){
  cap = cap || 20000;
  var known = knownIds(acts), succ = successors(acts), paths = [], i;
  function walk(x, cur){
    if(paths.length >= cap) return;
    cur.push(x);
    if(succ[x].length === 0) paths.push(cur.slice());
    else for(var k = 0; k < succ[x].length; k++) walk(succ[x][k], cur);
    cur.pop();
  }
  for(i = 0; i < acts.length; i++){
    if(realPreds(acts[i], known).length === 0) walk(acts[i].id, []);
  }
  return paths;
}

/* ---------------------------------------------------------------
   CPM forward / backward pass.
   durOf is a parameter so tab 3 can pass te and tab 4 the crashed
   duration without duplicating the routine.
   --------------------------------------------------------------- */
function runCPM(acts, durOf){
  durOf = durOf || function(a){ return a.dur; };
  var order = topoOrder(acts);
  if(!order) return null;
  var known = knownIds(acts), succ = successors(acts), byId = {}, i, j, x, ps, v;
  for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];

  var ES = {}, EF = {}, LS = {}, LF = {}, slack = {}, duration = 0;

  /* forward: ES = max(EF of predecessors), EF = ES + t */
  for(i = 0; i < order.length; i++){
    x = order[i];
    ps = realPreds(byId[x], known);
    v = 0;
    for(j = 0; j < ps.length; j++) if(EF[ps[j]] > v) v = EF[ps[j]];
    ES[x] = ps.length ? v : 0;
    EF[x] = ES[x] + durOf(byId[x]);
    if(EF[x] > duration) duration = EF[x];
  }

  /* backward: LF = min(LS of successors), LS = LF - t */
  for(i = order.length - 1; i >= 0; i--){
    x = order[i];
    if(succ[x].length === 0) LF[x] = duration;
    else {
      v = Infinity;
      for(j = 0; j < succ[x].length; j++) if(LS[succ[x][j]] < v) v = LS[succ[x][j]];
      LF[x] = v;
    }
    LS[x] = LF[x] - durOf(byId[x]);
    slack[x] = LS[x] - ES[x];
  }
  return { ES:ES, EF:EF, LS:LS, LF:LF, slack:slack, duration:duration, order:order };
}

/* Activities with zero slack, in topological order. */
function criticalActivities(cpm){
  var out = [], i;
  for(i = 0; i < cpm.order.length; i++) if(near(cpm.slack[cpm.order[i]], 0)) out.push(cpm.order[i]);
  return out;
}

/* Length of one path under a duration function. */
function pathLength(path, byId, durOf){
  var s = 0;
  for(var i = 0; i < path.length; i++) s += durOf(byId[path[i]]);
  return s;
}

/* ---------------------------------------------------------------
   Structural validation of the activity table itself.
   --------------------------------------------------------------- */
function validateActs(acts){
  var errs = [], known = knownIds(acts), seen = {}, i, j, ps;
  for(i = 0; i < acts.length; i++){
    var a = acts[i];
    if(!a.id) errs.push('An activity has no name.');
    if(seen[a.id]) errs.push('Duplicate activity name "' + a.id + '".');
    seen[a.id] = true;
    ps = a.preds || [];
    for(j = 0; j < ps.length; j++){
      if(ps[j] === a.id) errs.push('"' + a.id + '" lists itself as a predecessor.');
      else if(!known[ps[j]]) errs.push('"' + a.id + '" lists unknown predecessor "' + ps[j] + '".');
    }
  }
  if(!topoOrder(acts)) errs.push('The precedence list contains a cycle — the network cannot be drawn.');
  return errs;
}


/* ---------------------------------------------------------------
   AOA validation (spec 4.4) — the heart of tab 1.

   nodes : [{id, x, y}]        event nodes the student created
   arcs  : [{from, to, act}]   act === null means a dummy
   acts  : the target activity table

   An activity x occupies arc tail(x) -> head(x).  The student's diagram
   asserts "x precedes y" exactly when tail(y) is reachable from head(x).
   That induced relation is compared against closure(acts) — NOT against
   the shape of any reference drawing — so any dummy routing that yields
   the correct precedence is accepted.
   --------------------------------------------------------------- */

/* Reflexive reachability over the event-node digraph. */
function nodeReachability(nodeIds, nsucc){
  var R = {}, i;
  for(i = 0; i < nodeIds.length; i++){
    var start = nodeIds[i], seen = {}, stack = [start];
    seen[start] = true;
    while(stack.length){
      var n = stack.pop(), ss = nsucc[n] || [];
      for(var k = 0; k < ss.length; k++) if(!seen[ss[k]]){ seen[ss[k]] = true; stack.push(ss[k]); }
    }
    R[start] = seen;
  }
  return R;
}

function digraphHasCycle(nodeIds, nsucc){
  var state = {}, i;   /* 0 unvisited, 1 on stack, 2 done */
  for(i = 0; i < nodeIds.length; i++) state[nodeIds[i]] = 0;
  var found = false;
  function dfs(n){
    if(found) return;
    state[n] = 1;
    var ss = nsucc[n] || [];
    for(var k = 0; k < ss.length; k++){
      if(state[ss[k]] === 1){ found = true; return; }
      if(state[ss[k]] === 0) dfs(ss[k]);
    }
    state[n] = 2;
  }
  for(i = 0; i < nodeIds.length; i++) if(state[nodeIds[i]] === 0) dfs(nodeIds[i]);
  return found;
}

function aoaValidate(nodes, arcs, acts){
  var rows = [], warnings = [], fatal = [], i, j, arc;
  var nodeIds = [], nodeSet = {};
  for(i = 0; i < nodes.length; i++){ nodeIds.push(nodes[i].id); nodeSet[nodes[i].id] = true; }

  /* arcs pointing at nodes that no longer exist */
  var goodArcs = [];
  for(i = 0; i < arcs.length; i++){
    arc = arcs[i];
    if(nodeSet[arc.from] && nodeSet[arc.to]) goodArcs.push(arc);
    else fatal.push('An arc refers to a node that is not on the canvas.');
  }

  /* event-node digraph */
  var nsucc = {};
  for(i = 0; i < nodeIds.length; i++) nsucc[nodeIds[i]] = [];
  for(i = 0; i < goodArcs.length; i++) nsucc[goodArcs[i].from].push(goodArcs[i].to);

  /* rule 2 — acyclicity */
  var cyclic = digraphHasCycle(nodeIds, nsucc);
  if(cyclic) fatal.push('The diagram contains a loop — an activity cannot eventually precede itself.');

  /* rule 1 — completeness: each activity on exactly one non-dummy arc */
  var placement = {};
  for(i = 0; i < goodArcs.length; i++){
    arc = goodArcs[i];
    if(arc.act != null){
      if(!placement[arc.act]) placement[arc.act] = [];
      placement[arc.act].push(arc);
    }
  }

  /* rule 3 — uniqueness: no two non-dummy arcs on the same node pair */
  var pair = {};
  for(i = 0; i < goodArcs.length; i++){
    arc = goodArcs[i];
    if(arc.act == null) continue;
    var key = arc.from + '>' + arc.to;
    if(!pair[key]) pair[key] = [];
    pair[key].push(arc.act);
  }

  var R = cyclic ? null : nodeReachability(nodeIds, nsucc);
  var target = closure(acts);
  var arcOf = {};
  for(var id in placement) if(placement.hasOwnProperty(id) && placement[id].length === 1) arcOf[id] = placement[id][0];

  /* one row per activity */
  for(i = 0; i < acts.length; i++){
    var a = acts[i], placed = placement[a.id] || [];
    if(placed.length === 0){ rows.push({ id:a.id, ok:false, kind:'unplaced', msg:'not on the diagram yet' }); continue; }
    if(placed.length > 1){
      rows.push({ id:a.id, ok:false, kind:'duplicate',
                  msg:'drawn ' + placed.length + ' times — each activity is exactly one arrow' });
      continue;
    }
    var mine = placed[0], sharedKey = mine.from + '>' + mine.to;
    if(pair[sharedKey].length > 1){
      var others = [];
      for(j = 0; j < pair[sharedKey].length; j++) if(pair[sharedKey][j] !== a.id) others.push(pair[sharedKey][j]);
      rows.push({ id:a.id, ok:false, kind:'sharedPair',
                  msg:'shares the same start and end node as ' + others.join(', ') +
                      '. A dummy is required to tell them apart.' });
      continue;
    }
    if(cyclic){ rows.push({ id:a.id, ok:false, kind:'cycle', msg:'cannot be checked until the loop is removed' }); continue; }

    /* rule 4 — precedence, by closure comparison */
    var missing = [], falsePrec = [];
    for(j = 0; j < acts.length; j++){
      var b = acts[j];
      if(b.id === a.id) continue;
      var bArc = arcOf[b.id];
      if(!bArc) continue;                                  /* b not placed — its own row says so */
      var studentSays = !!(R[mine.to] && R[mine.to][bArc.from]);
      var shouldBe = !!(target && target[a.id] && target[a.id][b.id]);
      if(shouldBe && !studentSays) missing.push(b.id);
      if(!shouldBe && studentSays) falsePrec.push(b.id);
    }
    if(missing.length){
      rows.push({ id:a.id, ok:false, kind:'missing',
                  msg:'does not reach ' + missing.join(', ') + ' — that precedence is lost' });
    } else if(falsePrec.length){
      rows.push({ id:a.id, ok:false, kind:'false',
                  msg:'wrongly comes before ' + falsePrec.join(', ') + ' — the table does not ask for that' });
    } else {
      rows.push({ id:a.id, ok:true, msg:'correct' });
    }
  }

  /* rule 5 — connectivity, warning only */
  if(!cyclic){
    var indeg = {}, outdeg = {}, starts = [], ends = [];
    for(i = 0; i < nodeIds.length; i++){ indeg[nodeIds[i]] = 0; outdeg[nodeIds[i]] = 0; }
    for(i = 0; i < goodArcs.length; i++){ outdeg[goodArcs[i].from]++; indeg[goodArcs[i].to]++; }
    for(i = 0; i < nodeIds.length; i++){
      if(indeg[nodeIds[i]] === 0) starts.push(nodeIds[i]);
      if(outdeg[nodeIds[i]] === 0) ends.push(nodeIds[i]);
    }
    if(starts.length > 1) warnings.push('There are ' + starts.length + ' starting nodes (' + starts.join(', ') + '). A project network normally begins at one node.');
    if(ends.length > 1) warnings.push('There are ' + ends.length + ' finishing nodes (' + ends.join(', ') + '). A project network normally ends at one node.');
  }

  var allOk = fatal.length === 0;
  for(i = 0; i < rows.length; i++) if(!rows[i].ok) allOk = false;
  return { ok:allOk, rows:rows, warnings:warnings, fatal:fatal };
}

/* ---------------------------------------------------------------
   Build a correct AOA diagram for a given activity table.
   Used by guided mode and by "show me". The construction mirrors how the
   deck draws its examples:

     - activities with no predecessors leave a single START event
     - an activity whose predecessor set is P starts at the event meaning
       "every member of P is finished"
     - that event is REUSED from a predecessor's end event whenever it can be
       (every successor of that predecessor has exactly the same predecessor
       set), which is what keeps the dummy count down to the textbook figure
     - activities with no successors share one FINISH event, unless doing so
       would put two activities between the same pair of events

   On deck slides 12-13 this yields a:1->2, b:1->3, dummy 3->2, c:2->4, d:3->5,
   and on slides 15-16 a:1->2, b:1->3, dummy 3->2, c:2->4 — the deck's answers.
   --------------------------------------------------------------- */
function buildAOA(acts){
  var known = knownIds(acts), succ = successors(acts), byId = {}, i, j, k;
  for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];
  var order = topoOrder(acts);
  if(!order) return null;

  var next = 1;
  function newNode(){ return next++; }
  var START = newNode(), endNode = {}, arcs = [], mergeFor = {};

  function predKey(x){ return realPreds(byId[x], known).slice().sort().join(','); }

  function tailOf(x){
    var ps = realPreds(byId[x], known).slice().sort();
    if(!ps.length) return START;
    if(ps.length === 1) return endNode[ps[0]];
    var key = ps.join(',');
    if(mergeFor[key] != null) return mergeFor[key];
    /* reuse a predecessor's end event when nothing else leaves it */
    var chosen = null;
    for(k = 0; k < ps.length; k++){
      var p = ps[k], ok = succ[p].length > 0;
      for(j = 0; j < succ[p].length; j++) if(predKey(succ[p][j]) !== key){ ok = false; break; }
      if(ok){ chosen = endNode[p]; break; }
    }
    if(chosen == null) chosen = newNode();
    mergeFor[key] = chosen;
    for(k = 0; k < ps.length; k++)
      if(endNode[ps[k]] !== chosen) arcs.push({ from:endNode[ps[k]], to:chosen, act:null, why:'logic' });
    return chosen;
  }

  for(i = 0; i < order.length; i++){
    var x = order[i], t = tailOf(x);
    endNode[x] = newNode();
    arcs.push({ from:t, to:endNode[x], act:x });
  }

  /* one finishing event */
  var terminals = [];
  for(i = 0; i < acts.length; i++) if(succ[acts[i].id].length === 0) terminals.push(acts[i].id);
  if(terminals.length > 1){
    var FIN = newNode();
    for(k = 0; k < terminals.length; k++){
      var tid = terminals[k], myArc = null;
      for(j = 0; j < arcs.length; j++) if(arcs[j].act === tid) myArc = arcs[j];
      var clash = false;
      for(j = 0; j < arcs.length; j++)
        if(arcs[j].act != null && arcs[j].act !== tid && arcs[j].from === myArc.from && arcs[j].to === FIN) clash = true;
      if(clash) arcs.push({ from:endNode[tid], to:FIN, act:null, why:'identification' });
      else { myArc.to = FIN; endNode[tid] = FIN; }
    }
  }

  /* drop duplicate and self-looping dummies */
  var seen = {}, clean = [];
  for(i = 0; i < arcs.length; i++){
    var a = arcs[i];
    if(a.act == null){
      if(a.from === a.to) continue;
      var key2 = a.from + '>' + a.to;
      if(seen[key2]) continue;
      seen[key2] = true;
    }
    clean.push(a);
  }

  /* Repointing terminals at the finish event can leave events with nothing
     attached — drop them, or they would read as extra start/finish nodes. */
  var used = {};
  for(i = 0; i < clean.length; i++){ used[clean[i].from] = true; used[clean[i].to] = true; }

  /* renumber events in topological order so the drawing reads 1..n */
  var nodeIds = [], nsucc = {};
  for(i = 1; i < next; i++) if(used[i]){ nodeIds.push(i); nsucc[i] = []; }
  for(i = 0; i < clean.length; i++) nsucc[clean[i].from].push(clean[i].to);
  var indeg = {}, queue = [], seq = [];
  for(i = 0; i < nodeIds.length; i++) indeg[nodeIds[i]] = 0;
  for(i = 0; i < clean.length; i++) indeg[clean[i].to]++;
  for(i = 0; i < nodeIds.length; i++) if(indeg[nodeIds[i]] === 0) queue.push(nodeIds[i]);
  while(queue.length){
    var n0 = queue.shift();
    seq.push(n0);
    for(i = 0; i < nsucc[n0].length; i++) if(--indeg[nsucc[n0][i]] === 0) queue.push(nsucc[n0][i]);
  }
  var remap = {};
  for(i = 0; i < seq.length; i++) remap[seq[i]] = i + 1;
  var nodes = [];
  for(i = 0; i < seq.length; i++) nodes.push({ id:i + 1 });
  for(i = 0; i < clean.length; i++){ clean[i].from = remap[clean[i].from]; clean[i].to = remap[clean[i].to]; }

  return { nodes:nodes, arcs:clean };
}

/* Which activities force an IDENTIFICATION dummy: identical predecessor sets
   AND identical successor sets, so AOA would place them between the same two
   events (deck slides 15-16). Every other dummy is a LOGIC dummy (slides 12-13). */
function identificationGroups(acts){
  var known = knownIds(acts), succ = successors(acts), byId = {}, i, groups = {}, out = [];
  for(i = 0; i < acts.length; i++) byId[acts[i].id] = acts[i];
  for(i = 0; i < acts.length; i++){
    var id = acts[i].id;
    var key = realPreds(byId[id], known).slice().sort().join(',') + '|' + succ[id].slice().sort().join(',');
    if(!groups[key]) groups[key] = [];
    groups[key].push(id);
  }
  for(var k in groups) if(groups.hasOwnProperty(k) && groups[k].length > 1) out.push(groups[k]);
  return out;
}

/* ---------------------------------------------------------------
   AON validation (spec 4.5) — nodes are auto-placed, only arcs graded.
   'S' is the virtual start node feeding every activity with no predecessor.
   --------------------------------------------------------------- */
function aonTargetEdges(acts){
  var known = knownIds(acts), out = {}, i, j, ps;
  for(i = 0; i < acts.length; i++){
    ps = realPreds(acts[i], known);
    if(ps.length === 0) out['S>' + acts[i].id] = true;
    for(j = 0; j < ps.length; j++) out[ps[j] + '>' + acts[i].id] = true;
  }
  return out;
}

function aonValidate(arcs, acts){
  var target = aonTargetEdges(acts), student = {}, i, k;
  for(i = 0; i < arcs.length; i++) student[arcs[i].from + '>' + arcs[i].to] = true;

  var missing = [], extra = [];
  for(k in target) if(target.hasOwnProperty(k) && !student[k]) missing.push(k);
  for(k in student) if(student.hasOwnProperty(k) && !target[k]) extra.push(k);

  /* an extra edge u->v is "redundant" if u already reaches v another way */
  var cl = closure(acts), redundant = [], plainExtra = [];
  for(i = 0; i < extra.length; i++){
    var parts = extra[i].split('>'), u = parts[0], v = parts[1];
    if(u !== 'S' && cl && cl[u] && cl[u][v]) redundant.push(extra[i]);
    else plainExtra.push(extra[i]);
  }
  return {
    ok: missing.length === 0 && extra.length === 0,
    missing: missing, extra: plainExtra, redundant: redundant
  };
}

</script>

<script id="testScript">
/* =====================================================================
   ACCEPTANCE TESTS (spec section 10, plus additions from the deck check).
   Runs both in Node and in the page via ?test — one source of truth.
   ===================================================================== */

/* ---- preset data used by the tests ---- */
function mkActs(spec){
  /* spec: [ [id, dur, "preds,comma,separated"], ... ] */
  var out = [];
  for(var i = 0; i < spec.length; i++){
    out.push({ id: spec[i][0], dur: spec[i][1],
               preds: spec[i][2] ? spec[i][2].split(',') : [] });
  }
  return out;
}

function TEST_L1(){   /* critical-path example, deck slides 17-28 */
  return mkActs([['A',8,''],['B',4,''],['C',6,'A'],['D',11,'A'],['E',9,'B'],['F',3,'C'],['G',1,'D,E,F']]);
}
function TEST_L3(){   /* assignment network, deck slides 38-39 */
  return mkActs([['a',5,''],['b',7,'a'],['c',8,'a'],['d',2,'c'],['e',3,''],['f',6,'e'],
                 ['g',1,''],['h',2,'g'],['i',10,'b,d'],['k',17,'h'],['m',8,'f,i']]);
}
function TEST_L11(){  /* CPM on the crashing network, deck slide 27 */
  return mkActs([['a',6,''],['b',10,'a'],['c',5,''],['d',4,'c'],['e',9,'d'],['f',2,'b,e']]);
}

/* ---- the suite ---- */
function runAcceptanceTests(){
  var out = [], pass = 0, fail = 0;
  function group(name){ out.push({ group: name }); }
  function ok(name, cond, got, want){
    if(cond){ pass++; out.push({ ok:true, name:name, got:got }); }
    else { fail++; out.push({ ok:false, name:name, got:got, want:want }); }
  }
  function eq(name, got, want, tol){ ok(name, near(got, want, tol == null ? 1e-9 : tol), got, want); }
  function eqs(name, got, want){ ok(name, got === want, got, want); }

  /* ---------- L1 : CPM ---------- */
  group('L1 — critical path (deck slides 17-28)');
  var L1 = TEST_L1(), c1 = runCPM(L1);
  eq('duration', c1.duration, 20);
  var want = { A:[0,8,0,8,0], B:[0,4,6,10,6], C:[8,14,10,16,2], D:[8,19,8,19,0],
               E:[4,13,10,19,6], F:[14,17,16,19,2], G:[19,20,19,20,0] };
  for(var k in want) if(want.hasOwnProperty(k)){
    eqs(k + ' ES/EF/LS/LF/slack',
        [c1.ES[k], c1.EF[k], c1.LS[k], c1.LF[k], c1.slack[k]].join(','),
        want[k].join(','));
  }
  eqs('critical activities', criticalActivities(c1).sort().join(''), 'ADG');
  var byId1 = {}; for(var i = 0; i < L1.length; i++) byId1[L1[i].id] = L1[i];
  var p1 = enumeratePaths(L1).map(function(p){
    return p.join('-') + '=' + pathLength(p, byId1, function(a){ return a.dur; });
  }).sort();
  eqs('paths', p1.join(' '), 'A-C-F-G=18 A-D-G=20 B-E-G=14');

  /* ---------- L11 : CPM on the crashing network (deck slide 27) ---------- */
  group('L11 — critical path on the crashing network (deck slide 27)');
  var L11 = TEST_L11(), c11 = runCPM(L11);
  eq('duration', c11.duration, 20);
  eqs('slack a,b,c,d,e,f',
      ['a','b','c','d','e','f'].map(function(x){ return c11.slack[x]; }).join(','), '2,2,0,0,0,0');
  eqs('ES a,b,c,d,e,f', ['a','b','c','d','e','f'].map(function(x){ return c11.ES[x]; }).join(','), '0,6,0,5,9,18');
  eqs('LF a,b,c,d,e,f', ['a','b','c','d','e','f'].map(function(x){ return c11.LF[x]; }).join(','), '8,18,5,9,18,20');

  /* ---------- L3 : paths ---------- */
  group('L3 — assignment network (deck slides 38-39)');
  var L3 = TEST_L3(), byId3 = {};
  for(i = 0; i < L3.length; i++) byId3[L3[i].id] = L3[i];
  var p3 = enumeratePaths(L3).map(function(p){
    return p.join('-') + '=' + pathLength(p, byId3, function(a){ return a.dur; });
  }).sort();
  eqs('paths', p3.join(' '), 'a-b-i-m=30 a-c-d-i-m=33 e-f-m=17 g-h-k=20');
  eq('duration', runCPM(L3).duration, 33);

  /* ---------- L5 : AOA validation, identification dummy ---------- */
  group('L5 — AOA validation, parallel activities (deck slides 15-16)');
  var L5 = mkActs([['a',3,''],['b',4,''],['c',5,'a,b']]);
  var nodes4 = [{id:1},{id:2},{id:3},{id:4}];
  /* a and b between the same pair must fail rule 3 */
  var bad5 = aoaValidate(nodes4, [{from:1,to:2,act:'a'},{from:1,to:2,act:'b'},{from:2,to:4,act:'c'}], L5);
  ok('a and b on the same node pair is rejected', !bad5.ok, bad5.ok, false);
  eqs('the message names a shared node pair',
      bad5.rows.filter(function(r){ return r.kind === 'sharedPair'; }).length + ' rows', '2 rows');
  /* correct: b detours via node 3 with a dummy 3->2 */
  var good5 = aoaValidate(nodes4, [{from:1,to:2,act:'a'},{from:1,to:3,act:'b'},
                                   {from:3,to:2,act:null},{from:2,to:4,act:'c'}], L5);
  ok('a:1->2, b:1->3, dummy 3->2, c:2->4 passes', good5.ok, good5.ok, true);
  /* the mirror image must pass too — closure comparison, not shape matching */
  var mirror5 = aoaValidate(nodes4, [{from:1,to:2,act:'b'},{from:1,to:3,act:'a'},
                                     {from:3,to:2,act:null},{from:2,to:4,act:'c'}], L5);
  ok('the mirror image also passes', mirror5.ok, mirror5.ok, true);

  /* ---------- L4 : AOA validation, logic dummy ---------- */
  group('L4 — AOA validation, logic dummy (deck slides 12-13)');
  var L4 = mkActs([['a',3,''],['b',4,''],['c',5,'a,b'],['d',2,'b']]);
  var nodes5 = [{id:1},{id:2},{id:3},{id:4},{id:5}];
  var good4 = aoaValidate(nodes5, [{from:1,to:2,act:'a'},{from:1,to:3,act:'b'},
                                   {from:3,to:2,act:null},{from:2,to:4,act:'c'},
                                   {from:3,to:5,act:'d'}], L4);
  ok('correct diagram passes', good4.ok, good4.ok, true);
  var bad4 = aoaValidate(nodes5, [{from:1,to:2,act:'a'},{from:1,to:3,act:'b'},
                                  {from:3,to:2,act:null},{from:2,to:4,act:'c'},
                                  {from:2,to:5,act:'d'}], L4);
  ok('d placed at 2->5 is rejected', !bad4.ok, bad4.ok, false);
  var aRow = bad4.rows.filter(function(r){ return r.id === 'a'; })[0];
  eqs('the fault is reported as false precedence on a', aRow.kind, 'false');

  /* an unplaced activity is reported as such */
  var partial4 = aoaValidate(nodes5, [{from:1,to:2,act:'a'}], L4);
  eqs('unplaced activities are named',
      partial4.rows.filter(function(r){ return r.kind === 'unplaced'; })
                   .map(function(r){ return r.id; }).join(','), 'b,c,d');

  /* ---------- AON validation ---------- */
  group('AON validation');
  var aonActs = mkActs([['a',3,''],['b',4,''],['c',5,'a,b'],['d',2,'b']]);
  var aonGood = aonValidate([{from:'S',to:'a'},{from:'S',to:'b'},{from:'a',to:'c'},
                             {from:'b',to:'c'},{from:'b',to:'d'}], aonActs);
  ok('correct arc set passes', aonGood.ok, aonGood.ok, true);
  var aonMiss = aonValidate([{from:'S',to:'a'},{from:'S',to:'b'},{from:'a',to:'c'},
                             {from:'b',to:'d'}], aonActs);
  eqs('missing edge is named', aonMiss.missing.join(','), 'b>c');
  /* redundant edge: a->d added where a does not actually reach d -> plain extra */
  var aonExtra = aonValidate([{from:'S',to:'a'},{from:'S',to:'b'},{from:'a',to:'c'},
                              {from:'b',to:'c'},{from:'b',to:'d'},{from:'a',to:'d'}], aonActs);
  eqs('extra edge is named', aonExtra.extra.join(','), 'a>d');
  /* genuine redundancy: b->e where b already reaches e through c */
  var chain = mkActs([['b',1,''],['c',1,'b'],['e',1,'c']]);
  var aonRed = aonValidate([{from:'S',to:'b'},{from:'b',to:'c'},{from:'c',to:'e'},
                            {from:'b',to:'e'}], chain);
  eqs('transitively implied edge is flagged redundant', aonRed.redundant.join(','), 'b>e');

  /* ---------- buildAOA : the diagram guided mode draws ---------- */
  group('buildAOA — generated diagrams');
  function drawing(acts){
    var b = buildAOA(acts), out = [];
    for(var i = 0; i < b.arcs.length; i++)
      out.push((b.arcs[i].act == null ? 'dummy' : b.arcs[i].act) + ':' + b.arcs[i].from + '->' + b.arcs[i].to);
    return out.sort().join(' ');
  }
  /* deck slides 12-13. Event NUMBERING is not compared — any diagram with the
     right precedence is correct, which is the whole point of the validator. */
  var L4b = mkActs([['a',3,''],['b',4,''],['c',5,'a,b'],['d',2,'b']]);
  var L4d = buildAOA(L4b);
  ok('L4 drawing validates', aoaValidate(L4d.nodes, L4d.arcs, L4b).ok, true, true);
  eq ('L4 uses exactly one dummy', L4d.arcs.filter(function(a){ return a.act == null; }).length, 1);
  eq ('L4 has no orphaned events', L4d.nodes.length, 4);
  eqs('L4 every event is attached to an arc',
      (function(){
        var u = {}, i;
        for(i = 0; i < L4d.arcs.length; i++){ u[L4d.arcs[i].from] = 1; u[L4d.arcs[i].to] = 1; }
        for(i = 0; i < L4d.nodes.length; i++) if(!u[L4d.nodes[i].id]) return 'event ' + L4d.nodes[i].id + ' is orphaned';
        return 'all attached';
      })(), 'all attached');

  /* deck slides 15-16: one identification dummy */
  var L5b = mkActs([['a',3,''],['b',4,''],['c',5,'a,b']]);
  ok('L5 drawing validates', aoaValidate(buildAOA(L5b).nodes, buildAOA(L5b).arcs, L5b).ok, true, true);
  eq ('L5 uses exactly one dummy',
      buildAOA(L5b).arcs.filter(function(a){ return a.act == null; }).length, 1);
  eqs('L5 is flagged as an identification case',
      identificationGroups(L5b).map(function(g){ return g.join('+'); }).join(' '), 'a+b');
  eqs('L4 is NOT an identification case', identificationGroups(L4b).length, 0);

  /* M2 — two identification pairs (spec difficulty ladder) */
  var M2b = mkActs([['a',4,''],['b',4,''],['c',5,'a,b'],['d',3,'a,b']]);
  eqs('M2 has two identification pairs',
      identificationGroups(M2b).map(function(g){ return g.join('+'); }).sort().join(' '), 'a+b c+d');
  ok('M2 drawing validates', aoaValidate(buildAOA(M2b).nodes, buildAOA(M2b).arcs, M2b).ok, true, true);

  /* every lecture preset must produce a diagram the validator accepts */
  var allSets = { L1:TEST_L1(), L3:TEST_L3(), L11:TEST_L11(),
                  E1:mkActs([['a',4,''],['b',6,'a'],['c',3,'b'],['d',5,'c']]),
                  E2:mkActs([['a',5,''],['b',3,''],['c',4,'a'],['d',5,'b'],['e',2,'c,d']]),
                  M1:mkActs([['a',4,''],['b',6,''],['c',5,'a,b'],['d',7,'b'],['e',3,'c,d']]),
                  H1:mkActs([['a',6,''],['b',4,''],['c',5,'a'],['d',7,'a,b'],['e',9,'b'],['f',3,'c,d'],['g',2,'d,e']]),
                  H2:mkActs([['a',3,''],['b',5,''],['c',4,''],['d',6,'a,b'],['e',4,'b,c'],['f',2,'d'],['g',5,'d,e'],['h',3,'f,g']]) };
  for(var nm in allSets) if(allSets.hasOwnProperty(nm)){
    var bb = buildAOA(allSets[nm]);
    var vv = aoaValidate(bb.nodes, bb.arcs, allSets[nm]);
    ok(nm + ' generated diagram validates', vv.ok,
       vv.ok ? true : vv.rows.filter(function(r){ return !r.ok; }).map(function(r){ return r.id + ' ' + r.msg; }).join('; '), true);
    ok(nm + ' generated diagram has one start and one finish', vv.warnings.length === 0,
       vv.warnings.join(' | ') || 'clean', true);
  }

  /* ---------- table validation ---------- */
  group('Activity table validation');
  eqs('cycle is detected',
      validateActs(mkActs([['a',1,'b'],['b',1,'a']])).length > 0, true);
  eqs('unknown predecessor is detected',
      validateActs(mkActs([['a',1,'zz']]))[0].indexOf('unknown predecessor') > -1, true);
  eqs('self reference is detected',
      validateActs(mkActs([['a',1,'a']]))[0].indexOf('itself') > -1, true);
  eqs('clean table gives no errors', validateActs(TEST_L1()).length, 0);

  return { pass: pass, fail: fail, lines: out };
}

<script>
/* =====================================================================

   Stage 2 of 7. The four module bodies are filled in by later stages.
   ===================================================================== */

var $ = function(id){ return document.getElementById(id); };
var PALETTE = ['#2563eb','#16a34a','#ea580c','#9333ea','#0d9488','#dc2626','#ca8a04','#0891b2',
               '#4f46e5','#65a30d','#db2777','#0284c7'];
function colorOf(i){ return PALETTE[i % PALETTE.length]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function numFmt(v){ return v == null ? '' : (Math.round(v * 100) / 100).toString(); }
function fx(v, n){ return v == null ? '–' : v.toFixed(n == null ? 2 : n); }

/* ---------------------------------------------------------------
   Preset parser. The compact source format keeps the library readable:
     "a:6 b:10[a] c:5[a,b]"   =  id : duration [ comma-separated predecessors ]
   --------------------------------------------------------------- */
function splitTokens(s){ return s.trim().split(/\s+/); }
function predsOf(m){ return m ? m.split(',') : []; }

function parseDet(str){
  var out = [], t = splitTokens(str), i, m;
  for(i = 0; i < t.length; i++){
    m = /^([^:]+):([\d.]+)(?:\[([^\]]*)\])?$/.exec(t[i]);
    out.push({ id:m[1], dur:parseFloat(m[2]), preds:predsOf(m[3]) });
  }
  return out;
}

/* ---------------------------------------------------------------
   Preset library.  Slide numbers refer to "10 Project Management.pptx"
   (44 slides) and were checked against the deck itself.
   --------------------------------------------------------------- */
var PRESETS = {
  /* ---- lecture examples ---- */
  L1: { g:'Lecture examples', name:'Critical path network (slides 17–28)',
        det:'A:8 B:4 C:6[A] D:11[A] E:9[B] F:3[C] G:1[D,E,F]',
        note:'The deck names these activities three different ways. Here they are <b>A–G</b>; ' +
             'on the AOA diagram (slides 18, 25, 28) they are the arcs <b>1-2, 1-3, 2-4, 2-5, 3-5, 4-5, 5-6</b>, ' +
             'and on the AON diagram (slides 23–24) they are the digits <b>1, 3, 2, 5, 4, 6, 7</b>. ' +
             'Duration 20 days, critical path A–D–G.' },
  L9: { g:'Lecture examples', name:'Office move — the opening example (slides 4–5)',
        det:'Locate:8 Interview:4 Order:6[Locate] Remodel:11[Locate] Hire:9[Interview] Setup:3[Order] MoveIn:1[Remodel,Hire,Setup]',
        note:'Locate facilities · Interview · Order furniture · Remodel · Hire and train · Furniture setup · Move in. ' +
             'Drawn both ways in the deck: AOA on slide 4, AON on slide 5. Structurally this is the same network as L1.' },
  L2: { g:'Lecture examples', name:'Exercise — critical path (slide 27)',
        det:'a:6 b:10[a] c:5 d:4[c] e:9[d] f:2[b,e]',
        note:'Fully worked on slide 27: duration 20 days, slack 2 on a and b, zero on the rest. ' +
             'The deck reuses this same network for its crashing example on slides 40–42.' },
  L3: { g:'Lecture examples', name:'Assignment — critical path (slides 38–39)',
        det:'a:5 b:7[a] c:8[a] d:2[c] e:3 f:6[e] g:1 h:2[g] i:10[b,d] k:17[h] m:8[f,i]',
        note:'Paths: a-c-d-i-m = 33, a-b-i-m = 30, g-h-k = 20, e-f-m = 17. Duration 33 days. ' +
             'The deck also lists a twelfth activity <b>end</b> with predecessors k, m and no duration — omitted here.' },
  L4: { g:'Lecture examples', name:'Dummy — logic (slides 8–9, 12–14)',
        det:'a:3 b:4 c:5[a,b] d:2[b]',
        note:'A <b>logic dummy</b>. c needs both a and b, but d needs only b. If b ended where a ends, ' +
             'd would inherit a as a predecessor. The dummy carries b forward to c without connecting a to d. ' +
             'The same table is the AON exercise on slides 8–9. Durations are invented — the deck gives none.' },
  L5: { g:'Lecture examples', name:'Dummy — parallel activities (slides 15–16)',
        det:'a:3 b:4 c:5[a,b]',
        note:'An <b>identification dummy</b>. The logic is already correct — a and b simply cannot both be drawn ' +
             'between the same two nodes in AOA notation. Durations are invented — the deck gives none.' },
  L6: { g:'Lecture examples', name:'AOA exercise (slides 6–7)',
        det:'a:2 b:3 c:4[a] d:4[b] e:2[c]',
        note:'Durations are <b>invented for this tool</b> so the critical-path module has something to work with — ' +
             'the deck gives none.' },
  L7: { g:'Lecture examples', name:'AON exercise (slides 10–11)',
        det:'1:8 3:4 2:6[1] 5:11[1] 4:9[3] 6:3[2] 7:1[4,5,6]',
        note:'The deck names these activities with digits. This is <b>the same network as L1</b> ' +
             '(1=A, 3=B, 2=C, 5=D, 4=E, 6=F, 7=G), so the durations from slides 23–24 apply.' },
  /* ---- difficulty ladder ---- */
  E1: { g:'Difficulty ladder', name:'Easy 1 — single chain', det:'a:4 b:6[a] c:3[b] d:5[c]',
        note:'No branching at all. Every activity is critical; the forward and backward passes are pure addition and subtraction.' },
  E2: { g:'Difficulty ladder', name:'Easy 2 — two chains merge', det:'a:5 b:3 c:4[a] d:5[b] e:2[c,d]',
        note:'The first merge point, and the first activity with slack.' },
  M1: { g:'Difficulty ladder', name:'Medium 1 — one logic dummy', det:'a:4 b:6 c:5[a,b] d:7[b] e:3[c,d]',
        note:'Needs exactly one logic dummy in AOA.' },
  M2: { g:'Difficulty ladder', name:'Medium 2 — two parallel pairs', det:'a:4 b:4 c:5[a,b] d:3[a,b]',
        note:'c and d have identical predecessors, so AOA needs an identification dummy — twice over.' },
  H1: { g:'Difficulty ladder', name:'Hard 1 — two dummies, near-tied paths',
        det:'a:6 b:4 c:5[a] d:7[a,b] e:9[b] f:3[c,d] g:2[d,e]',
        note:'Longest path 16 with two paths at 15 close behind — small changes flip the critical path.' },
  H2: { g:'Difficulty ladder', name:'Hard 2 — three merge points',
        det:'a:3 b:5 c:4 d:6[a,b] e:4[b,c] f:2[d] g:5[d,e] h:3[f,g]',
        note:'Overlapping predecessor sets throughout. Duration 19 days.' }
};

/* ---------------------------------------------------------------
   Global state.  Every module reads STATE.acts.
   --------------------------------------------------------------- */
var STATE = {
  acts: [], mode:'guided', tab:'network', notation:'AOA', presetKey:'L1',
  aoa:{ nodes:[], arcs:[], nextNodeId:1 },
  aon:{ pos:{}, arcs:[] }
};

var TABS = [
  { key:'network', label:'1 · Network diagram', sub:'AOA and AON' },
  { key:'cp',      label:'2 · Critical path',   sub:'forward and backward pass' }
];

/* ---------------------------------------------------------------
   Preset handling
   --------------------------------------------------------------- */
function fillPresetSelect(){
  var groups = [], seen = {}, k;
  for(k in PRESETS) if(PRESETS.hasOwnProperty(k) && !seen[PRESETS[k].g]){ seen[PRESETS[k].g] = 1; groups.push(PRESETS[k].g); }
  var h = '';
  for(var i = 0; i < groups.length; i++){
    h += '<optgroup label="' + esc(groups[i]) + '">';
    for(k in PRESETS) if(PRESETS.hasOwnProperty(k) && PRESETS[k].g === groups[i])
      h += '<option value="' + k + '">' + esc(PRESETS[k].name) + '</option>';
    h += '</optgroup>';
  }
  h += '<optgroup label="Your own"><option value="custom">Custom / edited</option></optgroup>';
  $('preset').innerHTML = h;
}

function applyPreset(key){
  var p = PRESETS[key];
  if(!p) return;
  STATE.presetKey = key;
  STATE.acts = parseDet(p.det);
  resetDiagrams();
  $('preset').value = key;
  redrawAll();
}

/* A change to the activity set invalidates any diagram the student has drawn,
   and any part-finished walk through the critical-path passes. */
function resetDiagrams(){
  STATE.aoa = { nodes:[], arcs:[], nextNodeId:1 };
  STATE.aon = { pos:{}, arcs:[] };
  STATE.cp = null;
  STATE.net = null;
}
function markCustom(){
  if(STATE.presetKey !== 'custom'){ STATE.presetKey = 'custom'; $('preset').value = 'custom'; }
}

/* ---------------------------------------------------------------
   Activity table editor
   --------------------------------------------------------------- */
function renderEditor(){
  var a, i, h = '<table class="editT"><tr>' +
    '<th></th><th>Activity</th><th>Predecessors</th><th>Duration</th><th></th></tr>';
  for(i = 0; i < STATE.acts.length; i++){
    a = STATE.acts[i];
    h += '<tr><td class="sw"><span style="background:' + colorOf(i) + '"></span></td>';
    h += '<td><input class="id" data-i="' + i + '" data-k="id" value="' + esc(a.id) + '"></td>';
    h += '<td><input class="preds" data-i="' + i + '" data-k="preds" value="' + esc((a.preds || []).join(',')) + '"></td>';
    h += '<td><input type="number" step="any" min="0" data-i="' + i + '" data-k="dur" value="' + numFmt(a.dur) + '"></td>';
    h += '<td><button class="del" data-del="' + i + '" title="remove">✕</button></td></tr>';
  }
  $('editor').innerHTML = h + '</table>';
}

/* One handler for the whole table. */
function onEditorInput(e){
  var t = e.target, i = t.dataset ? t.dataset.i : null, k = t.dataset ? t.dataset.k : null;
  if(i == null || k == null) return;
  var a = STATE.acts[+i];
  if(k === 'id'){
    var oldId = a.id, newId = t.value.trim();
    if(newId && newId !== oldId){
      for(var j = 0; j < STATE.acts.length; j++){
        STATE.acts[j].preds = (STATE.acts[j].preds || []).map(function(p){ return p === oldId ? newId : p; });
      }
      a.id = newId;
      resetDiagrams();
    }
  }
  else if(k === 'preds'){
    a.preds = t.value.split(',').map(function(x){ return x.trim(); }).filter(function(x){ return x; });
    resetDiagrams();
  }
  else {
    var v = parseFloat(t.value);
    a[k] = isNaN(v) ? null : v;
  }
  markCustom();
  redrawAll(k === 'id' || k === 'preds');   /* re-render the table only when labels changed */
}

/* ---------------------------------------------------------------
   Validation panel
   --------------------------------------------------------------- */
function renderValidation(){
  var errs = validateActs(STATE.acts), h = '', i;
  if(errs.length){
    h = '<ul class="errList">';
    for(i = 0; i < errs.length; i++) h += '<li class="err">' + esc(errs[i]) + '</li>';
    h += '</ul>';
  } else {
    var cpm = runCPM(STATE.acts), paths = enumeratePaths(STATE.acts);
    h = '<ul class="errList"><li class="ok">' + STATE.acts.length + ' activities · ' +
        paths.length + ' path' + (paths.length === 1 ? '' : 's') + ' · project duration <b>' +
        numFmt(cpm.duration) + ' days</b></li></ul>';
  }
  $('validation').innerHTML = h;
  return errs.length === 0;
}

/* ---------------------------------------------------------------
   Tab bar and module bodies (bodies arrive in later stages)
   --------------------------------------------------------------- */
function renderTabBar(){
  var h = '', i;
  for(i = 0; i < TABS.length; i++){
    h += '<button data-tab="' + TABS[i].key + '"' + (STATE.tab === TABS[i].key ? ' class="on"' : '') + '>' +
         esc(TABS[i].label) + '<span class="tn">' + esc(TABS[i].sub) + '</span></button>';
  }
  $('tabbar').innerHTML = h;
